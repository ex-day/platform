# 開発用の「今」と「いる場所」の設定の見本（Issue #89・#114）
#
# このファイルは見本で、API は読まない。使うときはコピーして値を書き換える。
#   cp dev/exday-dev.example.yaml dev/exday-dev.local.yaml
# docker compose で起動した API は dev/exday-dev.local.yaml を読む（git の管理外）。
# ファイルがなければ、実際の日時（Asia/Tokyo）と既定エリア（桜木町駅の付近）を使う。
# 変えたら `docker compose restart api` で API を起動し直す。
# 「今」だけ、「いる場所」だけを固定したい場合は、使わない方を消す。
# キーの意味は apps/api/README.md の「「今」と「いる場所」の設定」を参照。
#
# 例：4月2日の15時に桜木町駅の前にいることにする。
exday:
  dev:
    clock:
      now: "2026-04-02T15:00:00+09:00"
    location:
      name: 桜木町駅
      lat: 35.4509
      lng: 139.6309
