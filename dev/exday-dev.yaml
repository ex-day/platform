# 開発用の「今」と「いる場所」の設定（Issue #89・#114）
#
# docker compose で起動した API が読む（compose.yaml で /config/exday-dev.yaml としてマウントする）。
# 値を書かなければ、実際の日時（Asia/Tokyo）と既定エリア（桜木町駅の付近）を使う。
# 変えたら `docker compose restart api` で API を起動し直す。
# キーの意味は apps/api/README.md の「「今」と「いる場所」の設定」を参照。
#
# 例：4月2日の15時に桜木町駅の前にいることにする場合は、下の # を外す。
#
# exday:
#   dev:
#     clock:
#       now: "2026-04-02T15:00:00+09:00"
#     location:
#       name: 桜木町駅
#       lat: 35.4509
#       lng: 139.6309
