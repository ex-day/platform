openapi: 3.1.0
info:
  title: ex-day API
  version: 0.2.0
  summary: 画面が使う取得用の API
  description: |
    画面が必要とする取得用の API の約束事。Issue #89 で S01・S03 の閲覧用として作り、
    Issue #135（根本整理）で、DB V2（docs/ex-day_db_design.md v0.2）に合わせて画面ごとに作り直している。

    - **作り直しの状況**：S03（Discovery のページ）は v0.2 の形（DB V2・画面定義の書き直しに合わせた）。
      S01（`/discovery-sections`）は v0.1 の形のままで、S01 の段で作り直す（それまで API の実装は動かない）。
      S13・S14・S15・S17 は、順に足す

    - 対象は読み取りだけ。投稿・リアクション・ログイン等の書き込みは扱わない（#75 を待たない）。
    - 用語は論理 Entity の設計（docs/ex-day_logical_entity_design.md）に合わせる。
    - 「今」と「いる場所」は、開発用の設定ファイル（YAML）で固定できる。固定しない場合は実際の日時と既定エリア（桜木町駅の付近）を使う。
      どちらを使ったかはレスポンスの `context` で返し、画面と API で食い違わないようにする。
    - 使ってみる人の現在地は、今は受け取らない（試す人の情報を取らない。場所を変えたいときは設定ファイルで変える）。
    - JSON の項目名は camelCase。エラーは RFC 9457（application/problem+json）。

    ## 季節と推薦の考え方
    「本当に今の季節のおすすめ」であることを大事にする。Value の季節の条件（DEC-0002）と「今」の季節を比べて、次のように扱う。

    | Value の季節 | 推薦 | おすすめ度 |
    |---|---|---|
    | 「今」の季節と一致 | する | 高い |
    | 通年、または季節の条件がない | する | 一致より低い |
    | 「今」の季節と違う | しない（S03 では「その他の魅力」に出す） | ― |

    ## 並び順は「推薦順」
    推薦の結果を返す配列（S01 のセクションのカード、S03 の Hero の推薦）は、推薦度の高い順（推薦順）に並べる。
    推薦度の評価要素は、距離・季節・時間・Value の Condition、将来はユーザーの興味・嗜好などを想定する。
    具体的なスコアリング・重み付け・評価ロジックはこの約束事に含めず、後続で設計する。
    「距離順」など特定の並べ方を約束しない（PoC の段階の簡易な実装、たとえば「季節の一致を優先し、次に距離を見る」を約束事として固定しない）。

    Discovery 自体の推薦順位と、その Discovery で代表して見せる Value の選択は、別の評価として扱う。
    同じ Discovery に「今おすすめ」の Value が複数ある場合、同じ Discovery が異なる Value を伴って、別の推薦候補として複数現れてよい。
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080/api/v1
    description: ローカル（docker compose）。画面のコンテナからは http://api:8080/api/v1
security: []  # 閲覧用のため認証なし（認証は #75 で決める）
tags:
  - name: S01
    description: TOP（v0.1 の形。S01 の段で作り直す）
  - name: S03
    description: Discovery のページ
paths:
  /discovery-sections:
    get:
      tags: [S01]
      operationId: getDiscoverySections
      summary: S01 に出すセクションの一覧を取得する（F01（discovery-sections））
      description: |
        どのセクションをどの順で出すかは API が決める。中身（カード）は含めず、セクションごとに
        /discovery-sections/{sectionKey}/discoveries で取る。

        - 今の提案の軸は「この近く」（nearby）と「今の時期」（season）の2つ（#89 の決定）。
          未ログインのため、興味（Subject）を使う軸は扱わない。
        - 一覧と中身を分けるのは、セクションごとに別々に読み込めるようにするため（モバイルは開いたタブの分だけ取る、
          PC は各セクションを並行して取る）。画面はセクションごとに読み込み中（C09（loading））を出す。
          あわせて、続きの読み込み（無限スクロール）や S02 への「もっと見る」、ログイン後の興味のセクションを足しやすくする。
      responses:
        '200':
          description: セクションの一覧（表示する順）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoverySectionList' }
              examples:
                sakuragicho-april:
                  $ref: '#/components/examples/SectionListSakuragichoApril'
  /discovery-sections/{sectionKey}/discoveries:
    get:
      tags: [S01]
      operationId: getDiscoverySectionItems
      summary: S01 の1つのセクションのカード（C05（discovery-section）の中身）を取得する
      description: |
        セクションは推薦の候補を絞り込む条件であり、並び順ではない。どのセクションも、候補を推薦順（推薦度の高い順）で返す。

        - nearby：いる場所の周辺にある Discovery の、推薦する Value（季節が一致、または通年・条件なし）を候補とする。
          季節違いの Value は候補にしない。
        - season：「今」の季節と一致する Value を候補とする。今は通年・条件なしの Value は候補にしない。
          季節は「今」の月から決める（3〜5月が春、など一般的な解釈）。
        - 対象は成立状態が ESTABLISHED かつ公開状態が PUBLIC の Discovery。
        - 1件のカードは、Discovery と、推薦の対象になった Value（valueId）の組。同じ Discovery が別の Value を伴って複数現れてよい。
        - 「周辺」の範囲と推薦度の評価ロジックは約束事に含めない（冒頭の「並び順は推薦順」を参照）。

        続きの読み込みの単位（cursor 方式にするか等）は、S01 の無限スクロールを試すときに決める。今は limit までを返す。
      parameters:
        - $ref: '#/components/parameters/SectionKey'
        - name: limit
          in: query
          required: false
          description: 最大件数
          schema: { type: integer, minimum: 1, maximum: 20, default: 8 }
      responses:
        '200':
          description: セクションのカード
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoverySectionItems' }
              examples:
                nearby-sakuragicho-april:
                  $ref: '#/components/examples/SectionItemsNearbySakuragichoApril'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: セクションがない（一覧にない key を指定した）
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /discoveries/{discoveryId}:
    get:
      tags: [S03]
      operationId: getDiscovery
      summary: S03（Discovery のページ）の内容を取得する
      description: |
        1つの Discovery の内容を、S03 の区画ごとに返す（画面定義 docs/ui/screens/S03-discovery-detail.md）。
        会話は Discovery の中に持たないので（DEC-0020 決定4）、このページは会話の Post を返さない。
        由来の会話とこの発見から始まった会話はカード（C40）で返し、会話の中身は会話のページ（S14）の API で取る。

        - **見えるもの**：一般のユーザーには、公開で、成立を取り消していない Discovery だけを返す（DB の visible_discovery）。
          非公開・成立を取り消した Discovery は、直接の識別子でも 404 にする。運営の権限で見る形は、認証（#75）のあとに足す
        - **統合された Discovery**：200 で返し、`mergedInto` に統合先を入れる。画面は統合先への案内を出し、
          「この発見について話す」とリアクションの操作を出さない（S03「初期表示」）
        - **Value の振り分け**：API が行い、画面では評価しない。
          推薦する Value（季節が一致、または通年・季節の条件なし）は `recommendations`（Hero、C19）に推薦順で、
          推薦しない Value（季節違い）は `otherValues`（その他の魅力、C12）に入れる（冒頭の「季節と推薦の考え方」）
        - **区画の中身がないとき**：配列は空、件数は 0 で返す。出すかどうか（中身のない区画は出さない）は画面で決める
        - **件数の多い区画**（この発見から始まった会話、関わる企画）は、新しい順に `limit` 件までと、全体の件数（`totalCount`）を返す。
          続きを見る API は、必要になったときに足す
        - 自分のリアクション、運営の操作（C38）・判断の記録は、認証（#75）のあとに足す
        - Discovery の現在状態（「今シーズンの情報あり」）は、判定（論理設計 4.5節の要検討）が決まってから足す
        - 「ここから行ける」（C35）の到達圏は、寄り道（F06）の API で取る。このページは起点の場所（`detourFrom`）だけを返す
      parameters:
        - $ref: '#/components/parameters/DiscoveryId'
      responses:
        '200':
          description: Discovery の内容
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryDetail' }
              examples:
                walk-april:
                  $ref: '#/components/examples/DiscoveryWalkApril'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    SectionKey:
      name: sectionKey
      in: path
      required: true
      description: セクションの key（/discovery-sections で返したもの）
      schema: { $ref: '#/components/schemas/SectionKey' }
    DiscoveryId:
      name: discoveryId
      in: path
      required: true
      description: Discovery の識別子。形式は約束しない（中身を解釈しない文字列として扱う）
      schema: { type: string, minLength: 1, maxLength: 64 }
  responses:
    BadRequest:
      description: 指定が正しくない（例：limit が範囲外、discoveryId が長すぎる）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: 対象がない、または一般のユーザーには見えない（非公開、成立を取り消した Discovery など）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    EvaluationContext:
      type: object
      description: 提案や Value の振り分けに使った「今」と「いる場所」。開発用の設定で固定したかどうかも返す
      required: [now, season, location, clockSource, locationSource]
      properties:
        now:
          type: string
          format: date-time
          description: 「今」
        season:
          $ref: '#/components/schemas/CurrentSeason'
        location:
          $ref: '#/components/schemas/Location'
        clockSource:
          type: string
          enum: [fixed, system]
          description: fixed は開発用の設定ファイルで固定した日時、system は実際の日時
        locationSource:
          type: string
          enum: [fixed, default]
          description: fixed は開発用の設定ファイルで指定した場所、default は既定エリア（桜木町駅の付近）
    Location:
      type: object
      required: [name, lat, lng]
      properties:
        name:
          type: string
          description: 表示用の名前（例：桜木町駅）
        lat: { type: number, format: double }
        lng: { type: number, format: double }
    CurrentSeason:
      type: string
      enum: [spring, summer, autumn, winter]
      description: 「今」の季節
    Season:
      type: string
      enum: [spring, summer, autumn, winter, all_year]
      description: Value の条件としての季節（DEC-0002。春・夏・秋・冬・通年）
    SectionKey:
      type: string
      enum: [nearby, season]
      description: 提案の軸。nearby は「この近く」、season は「今の時期」。軸が増えたら値を足す
    DiscoverySectionList:
      type: object
      required: [context, sections]
      properties:
        context: { $ref: '#/components/schemas/EvaluationContext' }
        sections:
          type: array
          description: 表示する順
          items: { $ref: '#/components/schemas/DiscoverySection' }
    DiscoverySection:
      type: object
      required: [key, title]
      properties:
        key: { $ref: '#/components/schemas/SectionKey' }
        title:
          type: string
          description: セクションの表示名（PC の見出し、モバイルのタブ）
    DiscoverySectionItems:
      type: object
      required: [context, key, items]
      properties:
        context: { $ref: '#/components/schemas/EvaluationContext' }
        key: { $ref: '#/components/schemas/SectionKey' }
        items:
          type: array
          description: 推薦順（推薦度の高い順）。0件のこともある（見せ方は画面で決める）
          items: { $ref: '#/components/schemas/RecommendedDiscoveryCard' }
    RecommendedDiscoveryCard:
      description: 推薦の候補としてのカード。Discovery と、推薦の対象になった Value の組
      allOf:
        - $ref: '#/components/schemas/DiscoveryCard'
        - type: object
          required: [valueId]
          properties:
            valueId:
              type: string
              description: 推薦の対象になった Value。同じ Discovery が複数現れる場合の区別にもなる
    DiscoveryCard:
      type: object
      description: C03（discovery-card）。Discovery と、代表して見せる Value の要約
      required: [id, title, subject, value, place]
      properties:
        id: { type: string }
        title: { type: string }
        subject:
          type: string
          description: 何についての価値か（例：桜並木、散策）
        value:
          type: string
          description: 代表して見せる Value の短い説明
        picture: { $ref: '#/components/schemas/Image' }
        place: { $ref: '#/components/schemas/PlaceSummary' }
    PlaceSummary:
      type: object
      description: 場所。地図は埋め込まず、テキストで表示する
      required: [name]
      properties:
        name: { type: string, description: 例：大岡川（桜木町駅〜蒔田） }
    Image:
      type: object
      description: 画像。今回のサンプルは権利の問題を避けるため仮の画像
      required: [url, alt]
      properties:
        url: { type: string, format: uri-reference }
        alt: { type: string }
    DiscoveryRef:
      type: object
      description: 別の Discovery への参照（統合先への案内など）
      required: [id, title]
      properties:
        id: { type: string }
        title: { type: string }
    PlaceRef:
      type: object
      description: 場所への参照。押すと場所のページ（S13）。座標は持たない（地図に出す場所は DiscoveryPlaceItem の geometry）
      required: [id, name]
      properties:
        id:
          type: string
          description: 場所の識別子（画面・URL に出すもの）
        name: { type: string, description: 例：小机城址 }
    Geometry:
      type: object
      description: |
        場所の形（GeoJSON の Geometry。座標は経度・緯度の順、WGS84）。地点は Point、経路は LineString・MultiLineString、
        エリアは Polygon・MultiPolygon。座標は API の本文でだけ返し、URL には出さない（DEC-0022）
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Point, LineString, MultiLineString, Polygon, MultiPolygon]
        coordinates:
          description: GeoJSON の coordinates（type ごとに入れ子の深さが違う）
    DiscoveryDetail:
      type: object
      required: [id, title, summary, context, displayPlaces, aspects, recommendations, otherValues, origins, reactions,
                 places, findings, originConversations, startedConversations, projects, relations]
      properties:
        id: { type: string }
        title: { type: string }
        summary:
          type: string
          description: 現在の要約
        mergedInto:
          $ref: '#/components/schemas/DiscoveryRef'
          description: 統合された Discovery のときだけ。統合先（S03 の「統合先への案内」、C15）
        context: { $ref: '#/components/schemas/EvaluationContext' }
        displayPlaces:
          type: array
          description: |
            場所の見出し（「小机城址」「生麦 ほか」）。出す位置の場所（Discovery と場所の関係の役割が、体験できる場所・始まり）。
            順番のあるものは順番の順。1件以上
          minItems: 1
          items: { $ref: '#/components/schemas/PlaceRef' }
        aspects:
          type: array
          description: 観点（Subject の観点）の代表表記。押すとその言葉で S02
          items: { type: string }
        recommendations:
          type: array
          description: Hero（C19）に渡す、推薦する Value。推薦順（推薦度の高い順）。0件でも Hero は標準 Hero で表示する（Issue #50）
          items: { $ref: '#/components/schemas/ValueItem' }
        otherValues:
          type: array
          description: その他の魅力（C12）。季節違いで、今は推薦しない Value
          items: { $ref: '#/components/schemas/ValueItem' }
        origins:
          type: array
          description: 出所の表示（「みんなの会話から ex-day が取り出した発見です」「ex-day の発見（見本）」）に使う由来。1件以上
          minItems: 1
          items: { $ref: '#/components/schemas/DiscoveryOrigin' }
        reactions: { $ref: '#/components/schemas/DiscoveryReactions' }
        places:
          type: array
          description: 関わる場所（地図 C41 と一覧 C28）。Discovery と場所の関係をすべて。順番のあるものは順番の順。1件以上
          minItems: 1
          items: { $ref: '#/components/schemas/DiscoveryPlaceItem' }
        detourFrom:
          $ref: '#/components/schemas/PlaceRef'
          description: 「ここから行ける」（C35）の起点にする場所（出す位置の場所の最初のもの）。到達圏は寄り道（F06）の API で取る
        findings:
          type: array
          description: |
            わかってきたこと（C25）。この発見のもとになった会話と、この発見から始まった会話の Finding（有効なものの今の版）。
            公開の会話のものだけ
          items: { $ref: '#/components/schemas/FindingItem' }
        originConversations:
          type: array
          description: この発見のもとになった会話（由来＝会話。C40）。公開の会話だけ
          items: { $ref: '#/components/schemas/ConversationCard' }
        startedConversations:
          $ref: '#/components/schemas/ConversationCardPage'
          description: この発見から始まった会話（入口＝この Discovery。C40）。公開の会話だけ、新しい順
        projects:
          $ref: '#/components/schemas/ProjectCardPage'
          description: 関わる企画（C29）。この Discovery、またはこの Discovery の場所を項目に持つ公開の企画
        relations: { $ref: '#/components/schemas/DiscoveryRelations' }
    ValueItem:
      type: object
      description: Value の1件分（Hero の推薦 C19・その他の魅力 C12）
      required: [id, description, conditions]
      properties:
        id: { type: string }
        description:
          type: string
          description: 価値の説明
        conditions:
          type: array
          description: 楽しめる条件の説明。内部の Condition の構造をそのまま出さず、表示用の説明にする。条件のない Value は空
          items: { $ref: '#/components/schemas/ConditionDescription' }
    ConditionDescription:
      type: object
      required: [label, text]
      properties:
        label:
          type: string
          description: 例：季節
        text:
          type: string
          description: 例：春（3〜5月）
        seasons:
          type: array
          description: 季節の条件の場合の値（画面で表示を変えたいとき用）
          items: { $ref: '#/components/schemas/Season' }
    DiscoveryOrigin:
      type: object
      description: Discovery の由来の1件分
      required: [kind, establishedBy]
      properties:
        kind:
          type: string
          enum: [conversation, post, project, derived, operator]
          description: conversation は会話から、post は1つの投稿から、project は企画の登録から、derived は派生、operator は運営の登録（見本）
        establishedBy:
          type: string
          enum: [auto, human]
          description: 成立の判断の方式。auto は ex-day が自動で成立させた、human は人（運営）が判断した
    DiscoveryReactions:
      type: object
      description: Discovery へのリアクションの数（C10。「わかる」「行ってみたい」）
      required: [agree, wantToGo]
      properties:
        agree: { type: integer, minimum: 0, description: わかる }
        wantToGo: { type: integer, minimum: 0, description: 行ってみたい }
    DiscoveryPlaceItem:
      type: object
      description: 関わる場所の1件分（Discovery と場所の関係）
      required: [place, spatialType, kinds, role, isDisplayPlace, geometry]
      properties:
        place: { $ref: '#/components/schemas/PlaceRef' }
        spatialType:
          type: string
          enum: [point, area, route]
          description: 場所の形（地点・エリア・経路）
        kinds:
          type: array
          description: 場所の種類（城跡・公園・駅・坂 等）
          items: { type: string }
        role:
          type: string
          description: |
            この Discovery での役割（記憶の場所、今の跡地、体験できる場所、始まり・経由・終わり 等）。
            値は足せる形にするため列挙しない。表示名は画面で決める（例：START → 始まり）
        order:
          type: integer
          minimum: 1
          description: 順番のある組み合わせ（コースの Discovery）のときの順番
        period:
          $ref: '#/components/schemas/Period'
          description: この関係の期間（過去の運行区間など）。分からなければ持たない
        description: { type: string, description: この場所での説明 }
        isDisplayPlace:
          type: boolean
          description: 出す位置の場所か（場所の見出し・一覧で数えるときの場所）
        geometry: { $ref: '#/components/schemas/Geometry' }
    Period:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
    FindingItem:
      type: object
      description: |
        わかってきたこと（C25）の1件分。ex-day の見立てであり、事実の認定ではない。断定の書き方にしない。
        リアクションは種類と裏付けで決まる（論理設計 4.7節）。

        | 種類 | backed | reactions |
        |---|---|---|
        | 価値（value） | false | agree・wantToGo |
        | 裏付けのない説（theory） | false | maybe |
        | 裏付けのある説（theory） | true | 返さない |
      required: [id, kind, text, backed]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [value, theory]
          description: value は価値、theory は説（観察を含む）
        text:
          type: string
          description: 今の版の内容
        backed:
          type: boolean
          description: 資料・出典の裏付けがある説か
        unconfirmed:
          type: boolean
          description: 未確認の見立てか
        reactions:
          type: object
          description: 種類ごとのリアクション数。裏付けのある説では返さない
          properties:
            agree: { type: integer, minimum: 0, description: わかる }
            wantToGo: { type: integer, minimum: 0, description: 行ってみたい }
            maybe: { type: integer, minimum: 0, description: そうかも }
    ConversationCard:
      type: object
      description: 会話カード（C40）。押すと会話のページ（S14）
      required: [id, excerpt, starterName, replyCount, startedAt, places]
      properties:
        id:
          type: string
          description: 会話の識別子
        excerpt:
          type: string
          description: 最初の Post の本文の冒頭
        starterName:
          type: string
          description: 会話を始めた人の今のニックネーム（表示のたびに引く。Issue #74）
        replyCount:
          type: integer
          minimum: 0
          description: 返信の数（公開の Post の数から最初の Post を除いたもの）
        startedAt: { type: string, format: date-time }
        lastPostedAt:
          type: string
          format: date-time
          description: 最後の公開の Post の時点
        places:
          type: array
          description: 会話と場所の採用した紐付き（採用中・再検討中）。0件なら場所未定
          items: { $ref: '#/components/schemas/PlaceRef' }
    ConversationCardPage:
      type: object
      required: [items, totalCount]
      properties:
        items:
          type: array
          description: 新しい順に最大10件
          items: { $ref: '#/components/schemas/ConversationCard' }
        totalCount: { type: integer, minimum: 0 }
    ProjectCard:
      type: object
      description: 企画カード（C29）。押すと企画のページ（S15）
      required: [id, title, type, creatorKind, creatorName, matchedBy]
      properties:
        id: { type: string }
        title: { type: string }
        type:
          type: string
          enum: [course, ranking, collection, memory]
          description: コース・番付・まとめ・記憶
        creatorKind:
          type: string
          enum: [operator, user]
          description: 運営の企画か、ユーザーの企画か（ユーザーの企画は「ex-day の認定ではありません」を添える）
        creatorName:
          type: string
          description: 作った人の今のニックネーム
        matchedBy:
          type: string
          enum: [discovery, place]
          description: この Discovery を項目に持つか（discovery）、この Discovery の場所を項目に持つか（place）
        position:
          type: integer
          minimum: 1
          description: この企画の中の順番・順位（コース・番付のとき）。複数の項目が当てはまるときは最初のもの
    ProjectCardPage:
      type: object
      required: [items, totalCount]
      properties:
        items:
          type: array
          description: 新しい順に最大10件
          items: { $ref: '#/components/schemas/ProjectCard' }
        totalCount: { type: integer, minimum: 0 }
    DiscoveryRelations:
      type: object
      description: |
        関係する Discovery の3つの枠。該当がない枠は空の配列。公開で成立を取り消していない Discovery だけ。
        MVP では派生・関連は運営が手で決めるので、多くの Discovery では空になる。Subject を介した意味の関連は、後で足す
      required: [derivedFrom, derivedTo, related]
      properties:
        derivedFrom:
          type: array
          description: 派生元（この発見のもとになった Discovery）
          items: { $ref: '#/components/schemas/DiscoverySummary' }
        derivedTo:
          type: array
          description: 派生した Discovery（この発見から広がった Discovery）
          items: { $ref: '#/components/schemas/DiscoverySummary' }
        related:
          type: array
          description: 明示的に関連付けた Discovery
          items: { $ref: '#/components/schemas/DiscoverySummary' }
    DiscoverySummary:
      type: object
      description: |
        Discovery のカード（C03）に出す要約。S03 の関係する Discovery で使う。
        S01 の DiscoveryCard（v0.1 の形）は、S01 の段でこの形にそろえる
      required: [id, title, summary, displayPlaces]
      properties:
        id: { type: string }
        title: { type: string }
        summary: { type: string }
        displayPlaces:
          type: array
          items: { $ref: '#/components/schemas/PlaceRef' }
    Problem:
      type: object
      description: RFC 9457 Problem Details
      required: [title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
