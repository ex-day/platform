openapi: 3.1.0
info:
  title: ex-day API
  version: 0.2.0
  summary: 画面が使う取得用の API
  description: |
    画面が必要とする取得用の API の約束事。Issue #89 で S01・S03 の閲覧用として作り、
    Issue #135（根本整理）で、DB V2（docs/ex-day_db_design.md v0.2）に合わせて画面ごとに作り直している。

    - **作り直しの状況**：S01（TOP）・S03（Discovery のページ）・S13（場所のページ）・S14（会話のページ）・S15（企画のページ）・
      S17（企画の一覧）を v0.2 の形（DB V2・画面定義の書き直しに合わせた）にした。v0.1 の S01 の `/discovery-sections` は
      `/top` に置き換えて消した（PR #158）
    - **型と制約を約束事に書く**（2026-11-17 の人の判断、PR #152 のレビュー）：画面は OpenAPI から TypeScript の型を作るので、
      制約や型を付けられるところは設計の段から付ける。識別子の形（PublicId）、数の下限・配列の上限、`additionalProperties: false`、
      形の違うものは `oneOf` で分け、各分岐の判別の項目（`type`・`status` 等）を1つの値に制限する（GeoJSON の Geometry、
      わかってきたこと、統合の状態、会話カード）。TypeScript では判別できる union 型になる。
      OpenAPI の `discriminator` は書かない（API の Java の生成器（openapi-generator 7.10）が、判別の項目を列挙にしたときに
      正しいコードを作れないため。PR #152）。判別の項目は文字列にし、真偽にしない（同じ生成器が、真偽を1つの値に制限した型を作れないため）。
      配列に `uniqueItems` は書かず、重複しないことは説明に書く（同じ生成器が、使っていない Jackson 2 の注釈を付けるため。PR #155）
      足せる形にする値（場所の役割・種類）は列挙にせず、形だけを制約し、知らない値でも画面が壊れないようにする

    - 対象は読み取りだけ。投稿・リアクション・ログイン等の書き込みは扱わない（#75 を待たない）。
    - 用語は論理 Entity の設計（docs/ex-day_logical_entity_design.md）に合わせる。
    - 「今」は、開発用の設定ファイル（YAML）で固定できる。S03 の「いる場所」も同じく固定でき、固定しない場合は既定エリア（桜木町駅の付近）を使う。
      どちらを使ったかは S03 のレスポンスの `context` で返し、画面と API で食い違わないようにする。
    - 使ってみる人の現在地は、今は受け取らない。TOP（`/top`）の起点は場所の識別子で受け、座標を受けない（DEC-0022 決定5）。
    - JSON の項目名は camelCase。エラーは RFC 9457（application/problem+json）。

    ## 季節と推薦の考え方
    「本当に今の季節のおすすめ」であることを大事にする。Value の季節の条件（DEC-0002）と「今」の季節を比べて、次のように扱う。

    | Value の季節 | 推薦 | おすすめ度 |
    |---|---|---|
    | 「今」の季節と一致 | する | 高い |
    | 通年、または季節の条件がない | する | 一致より低い |
    | 「今」の季節と違う | しない（S03 では「その他の魅力」に出す） | ― |

    TOP（`/top`）の「いま・この時期」は、「今」の季節と一致する Value だけを対象にする（通年・条件なしは含めない）。

    ## 並び順は「推薦順」（S03 の Hero の推薦）
    S03 の Hero の推薦は、推薦度の高い順（推薦順）に並べる。TOP（`/top`）は推薦順ではなく、枠ごとの意味に合った全順序で返す（getTop の説明）。
    推薦度の評価要素は、距離・季節・時間・Value の Condition、将来はユーザーの興味・嗜好などを想定する。
    具体的なスコアリング・重み付け・評価ロジックはこの約束事に含めず、後続で設計する。
    「距離順」など特定の並べ方を約束しない（PoC の段階の簡易な実装、たとえば「季節の一致を優先し、次に距離を見る」を約束事として固定しない）。

    Discovery 自体の推薦順位と、その Discovery で代表して見せる Value の選択は、別の評価として扱う。
    同じ Discovery に「今おすすめ」の Value が複数ある場合、同じ Discovery が異なる Value を伴って、別の推薦候補として複数現れてよい。
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080/api/v1
    description: ローカル（docker compose）。画面のコンテナからは http://api:8080/api/v1
security: []  # 閲覧用のため認証なし（認証は #75 で決める）
tags:
  - name: S01
    description: TOP
  - name: S03
    description: Discovery のページ
  - name: S13
    description: 場所のページ
  - name: S14
    description: 会話のページ
  - name: S15
    description: 企画のページ
  - name: S17
    description: 企画の一覧
  - name: F06
    description: 寄り道の到達圏と、駅の選び方（S12・C35・S02 が使う）
paths:
  /top:
    get:
      tags: [S01]
      operationId: getTop
      summary: S01（TOP）の全部の枠を取得する（F01（TOP の枠））
      description: |
        TOP の枠を1回で返す（画面定義 docs/ui/screens/S01-top.md「取得用 API で返すもの（案）」）。

        - **起点**：`from` の場所。省くと既定の起点（始める地域の中の場所。アプリの設定）。座標は受けない（DEC-0022 決定5）。
          統合された場所なら統合先をたどって起点にする。ない場所なら 404。起点は代表の1点に置き換えず、場所の形のまま扱う。
          文字列は解釈しない（自由な入力から起点の候補を出すのは F07・起点を選ぶ画面の後続の設計）
        - **近く**（暫定）：起点の形で分ける。POINT はその地点から対象の形まで直線で 3km 以内、AREA は対象の形が区域の中にある
          または区域と交わる、ROUTE は対象の形がその経路から直線で 3km 以内。TOP の枠の中身を選ぶための決まりで、
          小さな地図（S12・F06）の条件とは別（広げない）
        - **距離**：起点の形と対象の形の最短の直線の距離（メートル、四捨五入）。AREA の中・交わるものは 0。距離の順の同じ順位は識別子の順
        - **近くの場所**（このあたりの数字・番付・声を待っている）からは、起点自身と、起点を含む上位の場所（行政の区域・広域のエリア）を除く。
          上位かどうかは、場所どうしの関係を親へたどることと、対象の形が起点の形を覆うことで決める（代表の1点を使わない）
        - **見えるもの**：公開のものだけ（DB の visible_*）。統合された側の Discovery は出さない
        - **枠**：`sections` に、中身のある枠だけを F01 の優先の順で返す（お知らせ → いま・この時期 → 近くの発見 → 企画 → 番付 →
          見本 → 探しています → 声を待っている）。画面は並べ替えない。同じ `kind` の枠は1回だけ。中身のない枠は返さない
        - **重ねない**：1つの Discovery・場所は1つの枠にだけ出す（先の枠に置く）
        - **件数**：枠の順に、各枠へ「枠の上限」と「全体の予算 50 の残り」の小さいほうを配る。配られた数を超えて当てはまるものがあれば
          `hasMore` を true にする（全体の予算で切られた枠も含む）。1件も配られない枠は返さない。全体の数は返さない
        - **並び**：枠ごとの意味に合った全順序（各枠の説明）。同じ順位は識別子（文字コード）の順。日付などを種にした固定の並びは約束しない。
          詳細・S12 から戻ったときの状態は、Web が取得済みの応答とスクロール位置を保って戻す（DEC-0022 決定4）
        - **見本**：運営の登録を由来に持つ Discovery も、条件に合えばどの枠にも出し、`isExample` で見本と分かるようにする
        - **読み取りの一貫性**：1つの読み取り専用のトランザクション（REPEATABLE READ）の中で読む（apps/api/AGENTS.md）
        - **返さないもの**：小さな地図の帯の形（F06 のあと）、ログインしている人の興味のある地域（認証 #75 のあと）、許可済みの現在地からの起点
      parameters:
        - name: from
          in: query
          required: false
          description: 起点の場所の識別子。省けば既定の起点。形が合わなければ 400
          schema: { $ref: '#/components/schemas/PublicId' }
      responses:
        '200':
          description: TOP の枠
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopPage' }
              examples:
                sakuragicho-april:
                  $ref: '#/components/examples/TopSakuragichoApril'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /discoveries/{discoveryId}:
    get:
      tags: [S03]
      operationId: getDiscovery
      summary: S03（Discovery のページ）の内容を取得する
      description: |
        1つの Discovery の内容を、S03 の区画ごとに返す（画面定義 docs/ui/screens/S03-discovery-detail.md）。
        会話は Discovery の中に持たないので（DEC-0020 決定4）、このページは会話の Post を返さない。
        由来の会話とこの発見から始まった会話はカード（C40）で返し、会話の中身は会話のページ（S14）の API で取る。

        - **見えるもの**：一般のユーザーには、公開で、成立を取り消していない Discovery だけを返す（DB の visible_discovery）。
          非公開・成立を取り消した Discovery は、直接の識別子でも 404 にする。運営の権限で見る形は、認証（#75）のあとに足す
        - **統合された Discovery**：200 で返し、`merge.status` を merged にする。案内する統合先は `merge.target`
          （たどった最後の統合先。見えないときは返さない。MergeState）。`capabilities` で新しい会話・リアクションを受け付けないことを返す
          （S03「初期表示」）
        - **Value の振り分け**：API が行い、画面では評価しない。評価に要る情報が足りないとき、成立・不成立を推測しない（論理設計 4.5.4節）。
          推薦する Value（季節が一致、または通年・季節の条件なし）は `recommendations`（Hero、C19）に推薦順で、
          推薦しない Value（季節違い）は `otherValues`（その他の魅力、C12）に入れる（冒頭の「季節と推薦の考え方」）
        - **区画の中身がないとき**：配列は空、件数は 0 で返す。出すかどうか（中身のない区画は出さない）は画面で決める
        - **件数の多い区画**（この発見から始まった会話、関わる企画、関係する Discovery）は、決まった順に**最大10件（固定）**を返す。
          会話と企画は公開のものの全体の件数（`totalCount`）も返す。順と重ね方は ConversationCardPage・ProjectCardPage を参照。
          続きを見る API は、必要になったときに足す
        - **公開の境界**：ほかの対象を指して返すもの（統合先、会話カードの最初の Post、企画、関係する Discovery、わかってきたこと）も、
          一般のユーザーに見えるものだけを返す（DB 設計 2.5節）
        - 自分のリアクション、運営の操作（C38）・判断の記録は、認証（#75）のあとに足す
        - Discovery の現在状態（「今シーズンの情報あり」）は、判定（論理設計 4.5節の要検討）が決まってから足す
        - 「ここから行ける」（C35）の到達圏は、寄り道（F06）の API で取る。このページは起点の場所（`detourFrom`）だけを返す
      parameters:
        - $ref: '#/components/parameters/DiscoveryId'
      responses:
        '200':
          description: Discovery の内容
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryDetail' }
              examples:
                walk-april:
                  $ref: '#/components/examples/DiscoveryWalkApril'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /places/{placeId}:
    get:
      tags: [S13]
      operationId: getPlace
      summary: S13（場所のページ）の内容を取得する
      description: |
        1つの場所の内容を、S13 の区画ごとに返す（画面定義 docs/ui/screens/S13-place.md）。
        場所は Discovery や会話がなくても存在するので、発見も会話もない場所でも 200 を返す（中身のない区画は空）。
        「最初の声のお誘い」は、ここでの発見・このあたりで探している人がいます・この場所の会話がどれも空で、
        `capabilities.canStartConversation` が true のときに画面が出す（統合済みの場所では出さず、廃止の場所では出せる）。

        - **見えるもの**：場所は公開状態を持たないので、あれば返す（統合済み・廃止の場所も返す）。採用されていない場所（新しい場所の案）は
          場所ではないので、このページを持たない（論理設計 4.2節）。場所の中に出すもの（発見・会話・企画・探している話）は、
          一般のユーザーに見えるものだけ（DB 設計 2.5節）
        - **統合済みの場所**：200 で返し、`state.status` を merged にする。案内する統合先は `state.target`（たどった最後の統合先。
          最後の統合先を決められないときは返さない。PlaceState）。`capabilities` で、新しい会話を受け付けないことを返す
          （自動では移らない。S13 の判断待ちの「案内だけにする」案に従う）
        - **読み取りの一貫性**：1つの読み取り専用のトランザクション（REPEATABLE READ）の中で読み、応答はその時点の公開状態を表す
          （apps/api/AGENTS.md「読み取りの一貫性と公開制御」）
        - **件数の多い区画**（ここでの発見、このあたりで探している人がいます、この場所の会話、この場所が入っている企画、このあたりの場所）は、
          決まった順に、決まった数まで返し、公開のものの全体の件数（`totalCount`）を返す。続きを取る API は、必要になったときに足す
          （この場所の会話の続きは、S13 の中で読み込む。S13 の判断待ち）
        - **後で足すもの**：運営の操作（C38）・判断の記録（認証 #75 のあと）、小さな地図の到達圏（寄り道 F06 の API）、
          駅から先の行き方（DB に持っていない）、資料の撮影場所の候補（資料は二次開発）
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      responses:
        '200':
          description: 場所の内容
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceDetail' }
              examples:
                yamashita:
                  $ref: '#/components/examples/PlaceYamashita'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /conversations/{conversationId}:
    get:
      tags: [S14]
      operationId: getConversation
      summary: S14（会話のページ）の内容を取得する
      description: |
        1つの会話の内容を、S14 の区画ごとに返す（画面定義 docs/ui/screens/S14-conversation.md「取得用 API で返すもの」）。
        Post は、最初の Post と新しい Post の一定数だけを返す。それより前の Post は `getConversationPosts` で段階的に読む。

        - **見えるもの**：一般のユーザーには、公開の会話だけを返す（DB の visible_conversation）。非公開の会話は、直接の識別子でも 404。
          運営の権限で見る形は、認証（#75）のあとに足す
        - **公開状態は対象ごとに独立して扱う**（DB 設計 2.5節）：非公開の Post は、識別子・時点・返信先だけを返す（HiddenPost）。
          その Post を根拠にしたわかってきたこと・問い・場所の候補は、それ自身の公開状態で返す（F02・F10 で扱いを決め、外部公開の前に確定する）
        - **統合**：統合された問い・わかってきたこと・Discovery は出さない。問い・わかってきたことの統合先が別の会話なら、その会話への案内を返す
          （`moved`）。Discovery は最後の統合先を出す（公開の判定・循環の扱いは S03・S13 と同じ。DiscoverySummaryPage）
        - **区画の中身がないとき**：配列は空、件数は 0。出すかどうかは画面で決める（場所の候補が空で場所が決まっていれば C33 を出さない、等）
        - **件数**：区画ごとに上限を決め、上限のある区画は全体の数（`totalCount`）も返す。場所の状態は上限なし（採用は少数）。
          Post・わかってきたことの数は `postLimit`・`findingLimit` で変えられる（暫定の値。実際の画面で調整する）。
          場所の候補・問いは、採用中の候補・回答のある問いを上限によらず全部返し、ほかのものを上限まで返す
        - **読み取りの一貫性**：1つの読み取り専用のトランザクション（REPEATABLE READ）の中で読む（apps/api/AGENTS.md）
        - **返さないもの**：解析の状態（運用の記録の表がまだない）、運営の操作・判断の記録（認証 #75 のあと）、自分の Reaction・自分の声
          （認証のあと）、企画の変更の出来事（企画そのものの会話でも S14 には混ぜない。S15 で混ぜる）
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: postLimit
          in: query
          required: false
          description: 最初の Post に続けて返す、新しい Post の数（暫定の既定値20）
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: findingLimit
          in: query
          required: false
          description: 返すわかってきたことの数（暫定の既定値20）。続きは getConversationFindings で読む
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: 会話の内容
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationDetail' }
              examples:
                walk:
                  $ref: '#/components/examples/ConversationWalk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /conversations/{conversationId}/posts:
    get:
      tags: [S14]
      operationId: getConversationPosts
      summary: S14 の「これまでのやりとりを見る」で、それより前の Post を取得する
      description: |
        カーソル（`before`）より前の Post を、新しい側から `limit` 件だけ選び、古い順に並べて返す。最初の Post は含めない
        （getConversation がいつも返すので重複させない）。

        - **並び**：投稿の時点の古い順、同じ時点なら識別子の順（安定した並び）。カーソルはこの並びのキーで比べるので、
          読んでいる間に新しい Post が足されても範囲がずれない
        - **カーソル**：getConversation の `posts.olderCursor`、またはこの API の `olderCursor`。さらに前の Post（最初の Post を除く）が
          残っているときだけ返す。カーソルの中身を解釈しない
        - 非公開の Post も枠として返し、件数に数える（HiddenPost）
        - 会話が非公開、またはカーソルがこの会話のものでなければ 404。カーソルの形が合わなければ 400
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: before
          in: query
          required: true
          description: カーソル。これより前の Post を返す
          schema: { $ref: '#/components/schemas/PostCursor' }
        - name: limit
          in: query
          required: false
          description: 返す Post の数（暫定の既定値20）
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: それより前の Post
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OlderPostPage' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /conversations/{conversationId}/findings:
    get:
      tags: [S14]
      operationId: getConversationFindings
      summary: S14 のわかってきたことの続きを取得する
      description: |
        カーソル（`after`）より後のわかってきたことを、並び（FindingPage）の順に `limit` 件返す。
        会話が非公開、またはカーソルがこの会話のものでなければ 404。カーソルの形が合わなければ 400。
        カーソルのわかってきたことが、読んでいる間に統合・失効しても、並びのキーで比べるので続きを読める
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: after
          in: query
          required: true
          description: カーソル。これより後のわかってきたことを返す
          schema: { $ref: '#/components/schemas/FindingCursor' }
        - name: limit
          in: query
          required: false
          description: 返す数（暫定の既定値20）
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: わかってきたことの続き
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FindingPage' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects:
    get:
      tags: [S17]
      operationId: listProjects
      summary: S17（企画の一覧）の企画を取得する
      description: |
        公開の企画を、絞り込み・並べ方に合わせて一覧で返す（画面定義 docs/ui/screens/S17-project-list.md「取得用 API で返すもの」）。
        「もっと見る」は、応答の `nextCursor` を `after` に渡して続きを読む。

        - **見えるもの**：公開の企画だけ（DB の visible_project）。MVP では企画を閉じる機能を作らないので、公開の企画が「募集中」
        - **絞り込み**：型（`type`）と作った人（`creator`）。どちらも省けば全部。地域の条件と、TOP の企画の枠からの条件の引き継ぎは、
          S01 の段で決めてからこの API を拡張する（それまでは型と作った人だけ）
        - **並べ方**（`sort`）：今は `new`（新しい順）だけ。「新しい声の多い順」は、集計の期間・方式を決めてから値を足す
        - **全順序**：企画を作った時点の降順、同じ時点なら識別子（文字コード）の降順。新しい企画が足されても、読んでいる続きの範囲はずれない
        - **カーソル**：並びのキーと、絞り込み・並べ方を含む。作ったときと違う絞り込み・並べ方で渡されたら 400（条件を変えたら最初から読む）
        - **全体の数は返さない**：画面は総件数を出さず、カーソルで全部を読める。続きの有無は `nextCursor` の有無で表す。0件なら空の配列
        - **読み取りの一貫性**：1つの読み取り専用のトランザクション（REPEATABLE READ）の中で読む（apps/api/AGENTS.md）
        - **返さないもの**：「企画を作る」の見せ方（一定期間内の作成数の上限）は、認証（#75）のあと
      parameters:
        - name: type
          in: query
          required: false
          description: 企画の型で絞る。省けばすべて
          schema: { $ref: '#/components/schemas/ProjectType' }
        - name: creator
          in: query
          required: false
          description: 作った人の種類で絞る（運営／ユーザー）。省けばすべて
          schema: { $ref: '#/components/schemas/ProjectCreatorKind' }
        - name: sort
          in: query
          required: false
          description: 並べ方。今は new（新しい順）だけ
          schema: { $ref: '#/components/schemas/ProjectListSort' }
        - name: after
          in: query
          required: false
          description: カーソル（前の応答の nextCursor）。これより後の企画を返す
          schema: { $ref: '#/components/schemas/ProjectListCursor' }
        - name: limit
          in: query
          required: false
          description: 返す数（暫定の既定値20）
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: 企画の一覧
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectListPage' }
              examples:
                all:
                  $ref: '#/components/examples/ProjectListAll'
        '400':
          $ref: '#/components/responses/BadRequest'
  /projects/{projectId}:
    get:
      tags: [S15]
      operationId: getProject
      summary: S15（企画のページ）の内容を取得する
      description: |
        1つの企画の内容を、S15 の区画ごとに返す（画面定義 docs/ui/screens/S15-project.md「取得用 API で返すもの」）。
        タイムライン（企画そのものの会話の Post と企画の変更の出来事）は、新しい側から一定数だけを返す。それより前は `getProjectTimeline` で読む。

        - **見えるもの**：一般のユーザーには、公開の企画だけを返す（DB の visible_project）。非公開の企画は、直接の識別子でも 404。
          運営・その企画を作った人が非公開の企画を見る形と「編集する」の可否は、認証（#75）のあとに足す
        - **並び**：企画の公開を確かめてから項目を全部読み、指す先だけを公開の判定にかける（visible_project_item は使わない）。
          見えない Discovery を指す項目は、位置を残して `UnavailableProjectItem` にする（番付・コースの順位を飛ばさない）
        - **公開状態は対象ごとに独立して扱う**（DB 設計 2.5節）：非公開の Post は枠だけを返す（S14 の HiddenPost）
        - **企画の作った人**：運営の企画も、作ったアカウントの今のニックネームを返す。ユーザーの企画は、画面が「ex-day の認定ではありません」を添える
        - **読み取りの一貫性**：1つの読み取り専用のトランザクション（REPEATABLE READ）の中で読む（apps/api/AGENTS.md）
        - **返さないもの**：運営の操作（C38）、企画への Reaction（MVP では付けない）、企画どうしの関連付け
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: timelineLimit
          in: query
          required: false
          description: 新しい側から返すタイムラインの数（暫定の既定値20）
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: 企画の内容
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDetail' }
              examples:
                slopes:
                  $ref: '#/components/examples/ProjectSlopes'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/timeline:
    get:
      tags: [S15]
      operationId: getProjectTimeline
      summary: S15 の「これまでのやりとりを見る」で、それより前のタイムラインを取得する
      description: |
        カーソル（`before`）より前のタイムラインを、新しい側から `limit` 件だけ選び、古い順に並べて返す（並びは ProjectTimeline）。
        企画が非公開、またはカーソルがこの企画のタイムラインのものでなければ 404。カーソルの形が合わなければ 400
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: before
          in: query
          required: true
          description: カーソル。これより前のタイムラインを返す
          schema: { $ref: '#/components/schemas/TimelineCursor' }
        - name: limit
          in: query
          required: false
          description: 返す数（暫定の既定値20）
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: それより前のタイムライン
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OlderTimelinePage' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /detour/reach:
    get:
      tags: [F06]
      operationId: getDetourReach
      summary: 選んだ駅から、寄れる場所と「そこで何分過ごせるか」を取得する（F06 寄り道の到達圏）
      description: |
        F06 の結果を返す（機能の定義 docs/ui/functions/F06-detour-reach.md）。S12（寄り道）・C35（TOP の小さな地図）・S02 の移動時間が使う。
        S12 の寄り道先のまとまり・場所の上の Discovery は、この結果に場所の情報を重ねて作る（S12 の取得用 API の段で決める）。

        - **入力**：移動を始める駅（`from`。必須）・使える時間（`t`。分）・終わり方（`to`）。使える時間は、選んだ駅に着いた時点から数える。
          現在地・場所から選んだ駅までの移動、到着の駅から先の移動は含めない。座標は受けない（DEC-0022 決定5）
        - **終わり方**：`to` を省くと移動を始める駅へ戻る（既定）。`to=none` は寄り道先で終わる。`to=<駅の識別子>` は別の駅へ向かう
        - **計算**：鉄道（表定速度、乗るたびの待ち、乗換10分の固定）と、寄り道先の駅と場所の間の徒歩（片道15分まで）。時刻表は使わない。
          誤差は「行けない」側に寄せる（DEC-0013 決定1）。MVP ではバスを扱わない
        - **場所で過ごせる時間** ＝ 使える時間 − 行き（移動を始める駅 → 寄り道先）− 帰り（寄り道先 → 終わり）。15分以上の場所だけを返す
        - **経由した駅は返さない**（DEC-0014 決定2。駅を経由するか、場所へ直接届くかを約束の外に置く）。利用者に見せる行き方（`access`）は、あるときだけ返す
        - **見えるもの**：ACTIVE の場所だけ。Discovery の公開・非公開とは関係しない（場所は公開の対象。DEC-0020）
        - **並び**：過ごせる時間の長い順、同じなら場所の識別子（文字コード）の順（全順序）。S12 の並べ方の種類（`sort`）は、S12 の取得用 API の段で決める
        - **ページ**：この応答は、条件・寄り道をしないで着く時間・地図の帯と、寄れる場所の最初のページを返す。続きがあれば `nextCursor` を返し、
          続きは getDetourReachPlaces で読む（帯・条件はページで変わらないので、最初の応答だけで返す）。1ページの上限だけを持ち、
          寄れる場所の全体を件数で打ち切らない。全体の数は返さない（PR #165 のレビュー、2026-11-20）
        - **地図の帯**は寄れる場所から作らず、到達圏の全体から作る。続きのページを読んでも変わらない。画面は、地図の旗を今のページの場所だけに立てる（S12）
        - **計算の決まりの値**（待ち・乗換・歩きの速さ・15分の下限・帯）はアプリの設定で持つ。既定は F06「設定で持つ値」
      parameters:
        - $ref: '#/components/parameters/DetourFrom'
        - $ref: '#/components/parameters/DetourMinutes'
        - $ref: '#/components/parameters/DetourTo'
        - $ref: '#/components/parameters/DetourPlaceLimit'
      responses:
        '200':
          description: 寄り道の到達圏
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetourReach' }
              examples:
                sakuragicho-round-trip:
                  $ref: '#/components/examples/DetourReachSakuragicho'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /detour/reach/places:
    get:
      tags: [F06]
      operationId: getDetourReachPlaces
      summary: 寄り道の到達圏の、寄れる場所の続きを取得する（F06）
      description: |
        getDetourReach の `nextCursor`（または前のページの `nextCursor`）を `after` に渡して、寄れる場所の続きを読む。
        地図の帯・条件は返さない（最初の応答のものを使う）。並び・計算・見えるものは getDetourReach と同じ。

        - **条件**：`from`・`t`・`to` は最初と同じ値を渡す。カーソルを作ったときと違えば 400（条件を変えたら getDetourReach から読み直す）
        - **カーソル**：到達圏データの版・計算の決まりの値・条件・並びのキーを含む。読んでいる間に版や計算の決まりの値が切り替わっていたら 400
          （重複・欠落を出さないため。画面は getDetourReach から読み直す。既存の一覧と同じ扱い）
        - **前のページ**：API は「前へ」を持たない。画面が読んだページのカーソルを覚えて、もう一度読む
        - 時間が足りない（not_enough_time）ときは最初の応答に続きがないので、この API を呼ぶことはない（呼べば 400）
      parameters:
        - $ref: '#/components/parameters/DetourFrom'
        - $ref: '#/components/parameters/DetourMinutes'
        - $ref: '#/components/parameters/DetourTo'
        - name: after
          in: query
          required: true
          description: カーソル（前の応答の nextCursor）。これより後の寄れる場所を返す
          schema: { $ref: '#/components/schemas/DetourPlaceCursor' }
        - $ref: '#/components/parameters/DetourPlaceLimit'
      responses:
        '200':
          description: 寄れる場所の続き
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetourPlacePage' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /stations:
    get:
      tags: [F06]
      operationId: searchStations
      summary: 駅を名前で探す（寄り道の移動を始める駅・到着の駅を選ぶ）
      description: |
        駅の名前での検索（S12 の駅の選び方。F06「駅の選び方」）。駅は種類が駅の場所で、1つの駅の場所は乗換できる駅のまとまり1つ。
        同じ名前の駅を見分けられるように、路線と事業者を返す。

        - **当てはまり方**：名前が `q` と同じ → `q` で始まる → `q` を含む、の順。同じ順位の中は名前の読みの順、同じなら識別子の順
        - 駅の名前の「駅」は付けても付けなくてもよい（「新横浜」「新横浜駅」）
        - ACTIVE の駅だけ
      parameters:
        - name: q
          in: query
          required: true
          description: 探す文字（前後の空白は除く）
          schema: { type: string, minLength: 1, maxLength: 50 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        '200':
          description: 当てはまる駅
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StationList' }
        '400':
          $ref: '#/components/responses/BadRequest'
  /places/{placeId}/nearby-stations:
    get:
      tags: [F06]
      operationId: getPlaceNearbyStations
      summary: 場所のまわりの駅を取得する（移動を始める駅・到着の駅の候補）
      description: |
        場所のページの「ここから寄り道」などで、駅を選ぶための候補を出す（F06「駅の選び方」）。F06 の入力の決まりではなく、画面の補助。
        距離の順は候補の表示だけに使い、自動で決めたり「おすすめ」としたりしない。

        - **距離**：場所の形と駅の形の最短の直線の距離（メートル、四捨五入）。場所が駅なら、その駅を距離 0 で先頭に含める
        - 直線で 5km 以内の ACTIVE の駅を、距離の順（同じなら識別子の順）に `limit` 件まで。5km 以内に駅がなければ空
        - 統合された場所は 404 にせず、統合先のまわりの駅を返す（S13 と同じく統合をたどる）
      parameters:
        - $ref: '#/components/parameters/PlaceId'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 10, default: 5 }
      responses:
        '200':
          description: まわりの駅
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NearbyStationList' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /stations/nearby:
    post:
      tags: [F06]
      operationId: findStationsNearLocation
      summary: 現在地のまわりの駅を取得する（移動を始める駅の候補）
      description: |
        現在地から寄り道を調べるときに、移動を始める駅の候補を出す（F06「駅の選び方」）。**座標を URL に出さないため、本文で受ける**
        （DEC-0022 決定5）。読み取りだけで、何も書き込まない。

        - 座標は保存しない。API のアクセスのログ・エラーのログに本文を残さない
        - 直線で 5km 以内の ACTIVE の駅を、距離の順（同じなら識別子の順）に `limit` 件まで。5km 以内に駅がなければ空
        - 距離の順は候補の表示だけに使い、自動で決めたり「おすすめ」としたりしない
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StationsNearLocationRequest' }
      responses:
        '200':
          description: まわりの駅
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NearbyStationList' }
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  parameters:
    PlaceId:
      name: placeId
      in: path
      required: true
      description: 場所の識別子（画面・URL に出すもの）。形が合わなければ 400
      schema: { $ref: '#/components/schemas/PublicId' }
    ConversationId:
      name: conversationId
      in: path
      required: true
      description: 会話の識別子（画面・URL に出すもの）。形が合わなければ 400
      schema: { $ref: '#/components/schemas/PublicId' }
    ProjectId:
      name: projectId
      in: path
      required: true
      description: 企画の識別子（画面・URL に出すもの）。形が合わなければ 400
      schema: { $ref: '#/components/schemas/PublicId' }
    DiscoveryId:
      name: discoveryId
      in: path
      required: true
      description: Discovery の識別子（画面・URL に出すもの）。形が合わなければ 400
      schema: { $ref: '#/components/schemas/PublicId' }
    DetourFrom:
      name: from
      in: query
      required: true
      description: 移動を始める駅（種類が駅の場所の識別子）。ない場所なら 404、駅でない場所なら 400
      schema: { $ref: '#/components/schemas/PublicId' }
    DetourMinutes:
      name: t
      in: query
      required: true
      description: 使える時間（分）。30〜480分・15分刻み（S12）。合わなければ 400
      schema: { type: integer, minimum: 30, maximum: 480, multipleOf: 15 }
    DetourTo:
      name: to
      in: query
      required: false
      description: |
        終わり方。省くと移動を始める駅へ戻る。`none` は寄り道先で終わる。駅の識別子は、その駅へ向かう（ない場所なら 404、駅でない場所なら 400）
      schema: { type: string, pattern: '^(none|[0-9A-Za-z]{12})$' }
    DetourPlaceLimit:
      name: limit
      in: query
      required: false
      description: |
        1ページの寄れる場所の数（既存の一覧と同じ既定20・最大50）。S12 の地図の旗は今のページの場所だけに立てるので、地図に出す数もこれで決まる
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
  responses:
    BadRequest:
      description: 指定が正しくない（例：limit が範囲外、discoveryId が長すぎる）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: 対象がない、または一般のユーザーには見えない（非公開、成立を取り消した Discovery など）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    EvaluationContext:
      type: object
      description: 提案や Value の振り分けに使った「今」と「いる場所」。開発用の設定で固定したかどうかも返す
      required: [now, season, location, clockSource, locationSource]
      properties:
        now:
          type: string
          format: date-time
          description: 「今」
        season:
          $ref: '#/components/schemas/CurrentSeason'
        location:
          $ref: '#/components/schemas/Location'
        clockSource:
          type: string
          enum: [fixed, system]
          description: fixed は開発用の設定ファイルで固定した日時、system は実際の日時
        locationSource:
          type: string
          enum: [fixed, default]
          description: fixed は開発用の設定ファイルで指定した場所、default は既定エリア（桜木町駅の付近）
    Location:
      type: object
      required: [name, lat, lng]
      properties:
        name:
          type: string
          description: 表示用の名前（例：桜木町駅）
        lat: { type: number, format: double }
        lng: { type: number, format: double }
    CurrentSeason:
      type: string
      enum: [spring, summer, autumn, winter]
      description: 「今」の季節
    Season:
      type: string
      enum: [spring, summer, autumn, winter, all_year]
      description: Value の条件としての季節（DEC-0002。春・夏・秋・冬・通年）
    PublicId:
      type: string
      description: |
        画面・URL に出す識別子（英数字12文字。DB 設計 2.1節）。中身を解釈しない文字列として扱う。
        内部の連番は出さない
      pattern: '^[0-9A-Za-z]{12}$'
      minLength: 12
      maxLength: 12
    DiscoveryRef:
      type: object
      description: 別の Discovery への参照（統合先への案内など）
      additionalProperties: false
      required: [id, title]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        title: { type: string, minLength: 1 }
    PlaceRef:
      type: object
      description: 場所への参照。押すと場所のページ（S13）。座標は持たない（地図に出す形は DiscoveryPlaceItem の geometry）
      additionalProperties: false
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        name: { type: string, minLength: 1, description: 例：小机城址 }
    # ---- GeoJSON の Geometry（RFC 7946）。S03・S13・S15 で共用する ----
    Position:
      type: array
      description: 位置（経度, 緯度）。WGS84。高さは持たない
      prefixItems:
        - { type: number, format: double, minimum: -180, maximum: 180, description: 経度 }
        - { type: number, format: double, minimum: -90, maximum: 90, description: 緯度 }
      items: false
      minItems: 2
      maxItems: 2
    LineStringCoordinates:
      type: array
      description: 経路の位置の並び（2つ以上）
      items: { $ref: '#/components/schemas/Position' }
      minItems: 2
    LinearRingCoordinates:
      type: array
      description: 閉じた輪（4つ以上で、最初と最後が同じ位置）
      items: { $ref: '#/components/schemas/Position' }
      minItems: 4
    PolygonCoordinates:
      type: array
      description: 外側の輪と、穴の輪（0個以上）
      items: { $ref: '#/components/schemas/LinearRingCoordinates' }
      minItems: 1
    PointGeometry:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [Point] }
        coordinates: { $ref: '#/components/schemas/Position' }
    LineStringGeometry:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [LineString] }
        coordinates: { $ref: '#/components/schemas/LineStringCoordinates' }
    MultiLineStringGeometry:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [MultiLineString] }
        coordinates:
          type: array
          items: { $ref: '#/components/schemas/LineStringCoordinates' }
          minItems: 1
    PolygonGeometry:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [Polygon] }
        coordinates: { $ref: '#/components/schemas/PolygonCoordinates' }
    MultiPolygonGeometry:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [MultiPolygon] }
        coordinates:
          type: array
          items: { $ref: '#/components/schemas/PolygonCoordinates' }
          minItems: 1
    Geometry:
      description: |
        場所の形（GeoJSON の Geometry。RFC 7946）。`type` で判別する。地点は Point、経路は LineString・MultiLineString、
        エリアは Polygon・MultiPolygon。座標は API の本文でだけ返し、URL には出さない（DEC-0022）
      oneOf:
        - $ref: '#/components/schemas/PointGeometry'
        - $ref: '#/components/schemas/LineStringGeometry'
        - $ref: '#/components/schemas/MultiLineStringGeometry'
        - $ref: '#/components/schemas/PolygonGeometry'
        - $ref: '#/components/schemas/MultiPolygonGeometry'
    # ---- F06 寄り道の到達圏 ----
    Station:
      type: object
      description: 駅（種類が駅の場所。1つの駅の場所は乗換できる駅のまとまり1つ）。同じ名前の駅を見分けるために路線を返す
      additionalProperties: false
      required: [place, lines]
      properties:
        place: { $ref: '#/components/schemas/PlaceRef' }
        lines:
          type: array
          description: この駅を通る路線（事業者・路線の名前の順）。分からなければ空
          maxItems: 30
          items: { $ref: '#/components/schemas/StationLine' }
    StationLine:
      type: object
      additionalProperties: false
      required: [operator, name]
      properties:
        operator: { type: string, minLength: 1, description: 事業者（例：JR東日本、横浜市交通局） }
        name: { type: string, minLength: 1, description: 路線の名前（例：横浜線） }
    StationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Station' }
    NearbyStation:
      type: object
      additionalProperties: false
      required: [station, distanceMeters]
      properties:
        station: { $ref: '#/components/schemas/Station' }
        distanceMeters: { type: integer, minimum: 0, description: 直線の距離（メートル、四捨五入）。候補の表示の補助で、歩きの時間ではない }
    NearbyStationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/NearbyStation' }
    StationsNearLocationRequest:
      type: object
      description: 現在地（WGS84）。保存しない
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        limit: { type: integer, minimum: 1, maximum: 10, default: 5 }
    DetourEnd:
      description: |
        終わり方。`kind` で判別する
        - return：移動を始める駅へ戻る（`to` を省いたとき）
        - stop：寄り道先で終わる（`to=none`）
        - station：別の駅へ向かう（`to=<駅>`）
      oneOf:
        - $ref: '#/components/schemas/ReturnDetourEnd'
        - $ref: '#/components/schemas/StopDetourEnd'
        - $ref: '#/components/schemas/StationDetourEnd'
    ReturnDetourEnd:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [return] }
    StopDetourEnd:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [stop] }
    StationDetourEnd:
      type: object
      additionalProperties: false
      required: [kind, station]
      properties:
        kind: { type: string, enum: [station] }
        station: { $ref: '#/components/schemas/Station' }
    DetourReach:
      description: |
        寄り道の到達圏。`kind` で判別する
        - reachable：計算できた（寄れる場所が0件のときも、こちらで空の一覧）
        - not_enough_time：別の駅へ向かうときに、使える時間が寄り道をしないで着く時間より短い
      oneOf:
        - $ref: '#/components/schemas/ReachableDetourReach'
        - $ref: '#/components/schemas/NotEnoughTimeDetourReach'
    DetourCondition:
      type: object
      description: 計算に使った条件（入力を確かめた結果）。画面は「新横浜駅から計算します。現在地・選んだ場所から新横浜駅までの移動時間は含みません」を添える
      additionalProperties: false
      required: [from, minutes, end]
      properties:
        from: { $ref: '#/components/schemas/Station' }
        minutes: { type: integer, minimum: 30, maximum: 480, multipleOf: 15 }
        end: { $ref: '#/components/schemas/DetourEnd' }
    ReachableDetourReach:
      type: object
      additionalProperties: false
      required: [kind, condition, directMinutes, bands, places]
      properties:
        kind: { type: string, enum: [reachable] }
        condition: { $ref: '#/components/schemas/DetourCondition' }
        directMinutes:
          type: integer
          minimum: 0
          description: 寄り道をしないで終わりに着く時間（分）。戻る・寄り道先で終わるときは 0、別の駅へ向かうときは移動を始める駅 → 到着の駅
        bands:
          type: array
          description: 地図の帯。過ごせる時間の下限の小さい順（15・30・60・120分以上。設定の値）。形が空の帯は返さない
          maxItems: 10
          items: { $ref: '#/components/schemas/DetourBand' }
        places:
          $ref: '#/components/schemas/DetourPlacePage'
          description: 寄れる場所の最初のページ。続きは getDetourReachPlaces
    NotEnoughTimeDetourReach:
      type: object
      additionalProperties: false
      required: [kind, condition, directMinutes]
      properties:
        kind: { type: string, enum: [not_enough_time] }
        condition: { $ref: '#/components/schemas/DetourCondition' }
        directMinutes:
          type: integer
          minimum: 0
          description: 寄り道をしないで到着の駅に着く時間（分）。使える時間はこれより短い
    DetourPlacePage:
      type: object
      description: |
        寄れる場所の1ページ。過ごせる時間の長い順、同じなら場所の識別子の順。続きがあれば `nextCursor` を返す（getDetourReachPlaces の `after` に渡す）。
        全体の数は返さない。0件なら空の配列。ページの間で場所が統合されると同じ場所が重ねて出ることがあり、画面は場所の識別子で重複を除く
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/DetourPlace' }
        nextCursor: { $ref: '#/components/schemas/DetourPlaceCursor' }
    DetourPlaceCursor:
      type: string
      description: |
        寄れる場所の続きを読むカーソル。到達圏データの版・計算の決まりの値・条件（from・t・to）・並びのキー（過ごせる時間・場所の識別子）を含む。
        画面は中身を解釈せず、そのまま `after` に渡す。読めない値、条件の違う値、版や計算の決まりの値が切り替わった後の値は 400
      pattern: '^[0-9A-Za-z_-]{16,256}$'
      minLength: 16
      maxLength: 256
    DetourBand:
      type: object
      additionalProperties: false
      required: [minStayMinutes, geometry]
      properties:
        minStayMinutes: { type: integer, minimum: 0, description: この帯の中では、少なくともこの分数を過ごせる }
        geometry: { $ref: '#/components/schemas/MultiPolygonGeometry' }
    DetourPlace:
      type: object
      additionalProperties: false
      required: [place, kinds, position, stayMinutes, outboundMinutes, returnMinutes]
      properties:
        place: { $ref: '#/components/schemas/PlaceRef' }
        kinds:
          type: array
          description: 場所の種類（S13 の場所の見出しと同じ）
          maxItems: 10
          items: { type: string, minLength: 1 }
        position:
          $ref: '#/components/schemas/PointGeometry'
          description: 地図に出す代表点（地点はその点、エリアは面の上の1点、経路は始点）
        stayMinutes: { type: integer, minimum: 0, description: そこで何分過ごせるか（場所で使える時間の合計。15分以上） }
        outboundMinutes: { type: integer, minimum: 0, description: 移動を始める駅からこの場所まで（分。徒歩を含む） }
        returnMinutes: { type: integer, minimum: 0, description: この場所から終わりまで（分。徒歩を含む）。寄り道先で終わるときは 0 }
        access:
          $ref: '#/components/schemas/DetourAccess'
          description: 利用者に見せる行き方（あるときだけ）。計算の中で経由した駅の約束ではない
    DetourAccess:
      type: object
      description: 「新横浜駅から徒歩約8分」。MVP では徒歩だけ
      additionalProperties: false
      required: [station, mode, minutes, estimated]
      properties:
        station: { $ref: '#/components/schemas/PlaceRef' }
        mode: { type: string, enum: [walk], description: 手段。MVP では徒歩だけ（バスは扱わない） }
        minutes: { type: integer, minimum: 0, maximum: 15 }
        estimated: { type: boolean, description: 自動の目安なら true（画面で「目安」と出す）。行き方（公式・運営等）の分数なら false }
    # ---- S03 ----
    DiscoveryDetail:
      type: object
      additionalProperties: false
      required: [id, title, summary, merge, capabilities, context, displayPlaces, aspects, recommendations, otherValues,
                 origins, reactions, places, findings, originConversations, startedConversations, projects, relations]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        title: { type: string, minLength: 1 }
        summary:
          type: string
          description: 現在の要約（空のこともある）
        merge: { $ref: '#/components/schemas/MergeState' }
        capabilities: { $ref: '#/components/schemas/DiscoveryCapabilities' }
        context: { $ref: '#/components/schemas/EvaluationContext' }
        displayPlaces:
          type: array
          description: |
            場所の見出し（「小机城址」「生麦 ほか」）。出す位置の場所（Discovery と場所の関係の役割が EXPERIENCE・START）。
            順番のあるものは順番の順。出す位置の役割の場所がない Discovery では、関わる場所の最初のもの
          minItems: 1
          items: { $ref: '#/components/schemas/PlaceRef' }
        aspects:
          type: array
          description: 観点（Subject の観点）の代表表記。押すとその言葉で S02
          items: { type: string, minLength: 1 }
        recommendations:
          type: array
          description: |
            Hero（C19）に渡す、推薦する Value。推薦順（推薦度の高い順）。0件でも Hero は標準 Hero で表示する（Issue #50）。
            評価に要る情報が足りないとき、成立・不成立を推測しない（論理設計 4.5.4節）。今は季節だけで振り分けるので評価不能は起きない。
            評価不能を返す形と表示は、Recommendation の後続の設計で決める
          items: { $ref: '#/components/schemas/ValueItem' }
        otherValues:
          type: array
          description: その他の魅力（C12）。季節違いで、今は推薦しない Value
          items: { $ref: '#/components/schemas/ValueItem' }
        origins:
          type: array
          description: 出所の表示（「みんなの会話から ex-day が取り出した発見です」「ex-day の発見（見本）」）に使う由来。1件以上
          minItems: 1
          items: { $ref: '#/components/schemas/DiscoveryOrigin' }
        reactions: { $ref: '#/components/schemas/DiscoveryReactions' }
        places:
          type: array
          description: 関わる場所（地図 C41 と一覧 C28）。Discovery と場所の関係（有効なもの）をすべて。順番のあるものは順番の順。1件以上
          minItems: 1
          items: { $ref: '#/components/schemas/DiscoveryPlaceItem' }
        detourFrom:
          $ref: '#/components/schemas/PlaceRef'
          description: 「ここから行ける」（C35）の起点にする場所（displayPlaces の最初のもの）。到達圏は寄り道（F06）の API で取る
        findings:
          type: array
          description: |
            わかってきたこと（C25）。この発見のもとになった会話と、この発見から始まった会話の Finding（有効なものの今の版）。
            公開の会話のものだけ。取得の範囲（件数が増えたとき）は後続で決める
          items: { $ref: '#/components/schemas/FindingItem' }
        originConversations:
          type: array
          description: この発見のもとになった会話（由来＝会話。C40）。公開の会話だけ。会話の開始の時点の古い順
          items: { $ref: '#/components/schemas/ConversationCard' }
        startedConversations:
          $ref: '#/components/schemas/ConversationCardPage'
          description: この発見から始まった会話（入口＝この Discovery。C40）
        projects:
          $ref: '#/components/schemas/ProjectCardPage'
          description: |
            関わる企画（C29）。この Discovery、またはこの Discovery の関わる場所を項目に持つ企画。
            matchedBy は、この Discovery を指す項目があれば discovery（場所を指す項目もあっても discovery）、なければ place
        relations: { $ref: '#/components/schemas/DiscoveryRelations' }
    MergeState:
      description: |
        統合の状態。`status` で判別する。統合された Discovery を開いたときは、統合先への案内（C15）を出す（自動では移らない）。
        統合されたかどうか（status）と、案内する統合先（target）を分ける。
        - 統合先がさらに統合されているときは、たどった最後の統合先を target にする（循環は統合の処理（F12）で作らない）
        - 最後の統合先が一般のユーザーに見えない（非公開・成立の取り消し）ときは、target を返さない（ID・表題を出さない）。
          status は merged のまま返す
      oneOf:
        - $ref: '#/components/schemas/NotMerged'
        - $ref: '#/components/schemas/Merged'
    NotMerged:
      type: object
      description: 統合されていない
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [none] }
    Merged:
      type: object
      description: 統合された側
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [merged] }
        target:
          $ref: '#/components/schemas/DiscoveryRef'
          description: 案内する統合先（たどった最後の統合先）。一般のユーザーに見えるときだけ
    DiscoveryCapabilities:
      type: object
      description: |
        この Discovery に対して始められる操作（ログインの有無とは別に、対象として受け付けるか）。
        統合された側では、新しい会話（この発見について話す）とリアクションを受け付けない（S03「初期表示」）。
        統合される前からある会話は S14 で続けられる
      additionalProperties: false
      required: [canStartConversation, canReact]
      properties:
        canStartConversation: { type: boolean }
        canReact: { type: boolean }
    ValueItem:
      type: object
      description: Value の1件分（Hero の推薦 C19・その他の魅力 C12）
      additionalProperties: false
      required: [id, description, conditions]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        description:
          type: string
          minLength: 1
          description: 価値の説明
        conditions:
          type: array
          description: 楽しめる条件の説明。内部の Condition の構造をそのまま出さず、表示用の説明にする。条件のない Value は空
          items: { $ref: '#/components/schemas/ConditionDescription' }
    ConditionDescription:
      type: object
      additionalProperties: false
      required: [axis, label, text]
      properties:
        axis:
          type: string
          enum: [season]
          description: 条件の軸。軸が増えたら値を足す
        label:
          type: string
          minLength: 1
          description: 例：季節
        text:
          type: string
          minLength: 1
          description: 例：春（3〜5月）
        seasons:
          type: array
          description: 季節の条件の値（axis が season のとき）
          minItems: 1
          items: { $ref: '#/components/schemas/Season' }
    DiscoveryOrigin:
      type: object
      description: Discovery の由来の1件分
      additionalProperties: false
      required: [kind, establishedBy]
      properties:
        kind:
          type: string
          enum: [conversation, post, project, derived, operator]
          description: conversation は会話から、post は1つの投稿から、project は企画の登録から、derived は派生、operator は運営の登録（見本）
        establishedBy:
          type: string
          enum: [auto, human]
          description: 成立の判断の方式。auto は ex-day が自動で成立させた、human は人（運営）が判断した
    DiscoveryReactions:
      type: object
      description: Discovery へのリアクションの数（C10。「わかる」「行ってみたい」）
      additionalProperties: false
      required: [agree, wantToGo]
      properties:
        agree: { type: integer, minimum: 0, description: わかる }
        wantToGo: { type: integer, minimum: 0, description: 行ってみたい }
    DiscoveryPlaceRole:
      type: string
      description: |
        Discovery と場所の関係の役割のコード値（DB の discovery_place.role）。役割は例が出るたびに足せる形にするため、
        閉じた列挙にしない（論理設計 4.5.1節）。画面は、知っている値に表示名を当て、**知らない値は役割の名前を出さずに**
        「関わる場所」として出す（画面が壊れないようにする）。

        | 値 | 意味 | 出す位置の場所か |
        |---|---|---|
        | EXPERIENCE | 体験できる場所 | ○ |
        | START | 始まり | ○ |
        | VIA | 経由 | ― |
        | END | 終わり | ― |
        | MEMORY | 記憶の場所 | ― |
        | FORMER_SITE | 今の跡地 | ― |
        | AREA_EATEN | 食べられていた地域 | ― |
      pattern: '^[A-Z][A-Z0-9_]*$'
      maxLength: 40
    DiscoveryPlaceItem:
      type: object
      description: 関わる場所の1件分（Discovery と場所の関係）
      additionalProperties: false
      required: [place, spatialType, kinds, role, isDisplayPlace, geometry]
      properties:
        place: { $ref: '#/components/schemas/PlaceRef' }
        spatialType: { $ref: '#/components/schemas/SpatialType' }
        kinds:
          type: array
          description: 場所の種類（城跡・公園・駅・坂 等）。値は足せる形にするため列挙しない
          items: { type: string, minLength: 1 }
        role: { $ref: '#/components/schemas/DiscoveryPlaceRole' }
        order:
          type: integer
          minimum: 1
          description: 順番のある組み合わせ（コースの Discovery）のときの順番
        period:
          $ref: '#/components/schemas/Period'
          description: この関係の期間（過去の運行区間など）。分からなければ持たない
        description: { type: string, minLength: 1, description: この場所での説明 }
        isDisplayPlace:
          type: boolean
          description: 出す位置の場所か（displayPlaces に入っているか）
        geometry: { $ref: '#/components/schemas/Geometry' }
    Period:
      type: object
      description: 期間。片方だけのこともある
      additionalProperties: false
      minProperties: 1
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
    FindingItem:
      type: object
      description: |
        わかってきたこと（C25）の1件分。ex-day の見立てであり、事実の認定ではない。断定の書き方にしない。
        リアクションは種類と裏付けで決まる（論理設計 4.7節）。`kind` と `backing` で判別できるよう、3つに分ける。

        | 種類 | kind | backing | reactions |
        |---|---|---|---|
        | 価値 | value | （持たない） | agree・wantToGo |
        | 裏付けのない説 | theory | unbacked | maybe |
        | 裏付けのある説 | theory | backed | 返さない |
      oneOf:
        - $ref: '#/components/schemas/ValueFinding'
        - $ref: '#/components/schemas/UnbackedTheoryFinding'
        - $ref: '#/components/schemas/BackedTheoryFinding'
    ValueFinding:
      type: object
      additionalProperties: false
      required: [id, kind, text, version, createdAt, updatedAt, unconfirmed, reactions]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        kind: { type: string, enum: [value] }
        text: { type: string, minLength: 1, description: 今の版の内容 }
        version: { type: integer, minimum: 1, description: 今の版の番号（1から。言い換え等で新しい版になると増える） }
        createdAt: { type: string, format: date-time, description: わかってきたことができた時点 }
        updatedAt: { type: string, format: date-time, description: 今の版になった時点（版が1なら createdAt と同じ）。新しいものと更新されたものを見分けるのに使う }
        unconfirmed: { type: boolean, description: 未確認の見立てか }
        reactions:
          type: object
          additionalProperties: false
          required: [agree, wantToGo]
          properties:
            agree: { type: integer, minimum: 0, description: わかる }
            wantToGo: { type: integer, minimum: 0, description: 行ってみたい }
    UnbackedTheoryFinding:
      type: object
      additionalProperties: false
      required: [id, kind, text, version, createdAt, updatedAt, backing, unconfirmed, reactions]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        kind: { type: string, enum: [theory] }
        text: { type: string, minLength: 1, description: 今の版の内容 }
        version: { type: integer, minimum: 1, description: 今の版の番号（1から。言い換え等で新しい版になると増える） }
        createdAt: { type: string, format: date-time, description: わかってきたことができた時点 }
        updatedAt: { type: string, format: date-time, description: 今の版になった時点（版が1なら createdAt と同じ）。新しいものと更新されたものを見分けるのに使う }
        backing: { type: string, enum: [unbacked], description: 資料・出典の裏付けがない }
        unconfirmed: { type: boolean, description: 未確認の見立てか }
        reactions:
          type: object
          additionalProperties: false
          required: [maybe]
          properties:
            maybe: { type: integer, minimum: 0, description: そうかも }
    BackedTheoryFinding:
      type: object
      description: 資料・出典の裏付けがある説。リアクションを付けない（確からしさは資料・出典で決まる）
      additionalProperties: false
      required: [id, kind, text, version, createdAt, updatedAt, backing, unconfirmed]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        kind: { type: string, enum: [theory] }
        text: { type: string, minLength: 1, description: 今の版の内容 }
        version: { type: integer, minimum: 1, description: 今の版の番号（1から。言い換え等で新しい版になると増える） }
        createdAt: { type: string, format: date-time, description: わかってきたことができた時点 }
        updatedAt: { type: string, format: date-time, description: 今の版になった時点（版が1なら createdAt と同じ）。新しいものと更新されたものを見分けるのに使う }
        backing: { type: string, enum: [backed], description: 資料・出典の裏付けがある }
        unconfirmed: { type: boolean, description: 未確認の見立てか }
    ConversationCard:
      description: |
        会話カード（C40）。押すと会話のページ（S14）。公開の会話だけを返す。`firstPost`（最初の Post が見えるか）で判別する。
        **最初の Post が非公開のとき**は、本文の冒頭と始めた人を返さない（非公開の Post の本文と書いた人を出さない）。
        その場合のカードの見せ方、退会・削除された人の表示は、C40・F10 の設計に合わせる
      oneOf:
        - $ref: '#/components/schemas/ConversationCardWithFirstPost'
        - $ref: '#/components/schemas/ConversationCardWithoutFirstPost'
    ConversationCardWithFirstPost:
      type: object
      description: 最初の Post が一般のユーザーに見える会話
      additionalProperties: false
      required: [id, firstPost, excerpt, starterName, replyCount, startedAt, places]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        firstPost: { type: string, enum: [visible], description: 最初の Post が一般のユーザーに見える }
        excerpt:
          type: string
          minLength: 1
          description: 最初の Post の本文の冒頭
        starterName:
          type: string
          minLength: 1
          description: 会話を始めた人の今のニックネーム（表示のたびに引く。Issue #74）
        replyCount:
          type: integer
          minimum: 0
          description: 公開の返信の数（公開の Post の数から、最初の Post を除いたもの）
        startedAt:
          type: string
          format: date-time
          description: 会話の開始の時点（最初の Post の時点）
        lastPostedAt:
          type: string
          format: date-time
          description: 最後の公開の Post の時点
        places:
          type: array
          description: 会話と場所の採用した紐付き（採用中・再検討中）。0件なら場所未定
          items: { $ref: '#/components/schemas/PlaceRef' }
    ConversationCardWithoutFirstPost:
      type: object
      description: 最初の Post が非公開の会話（本文の冒頭と始めた人を返さない）
      additionalProperties: false
      required: [id, firstPost, replyCount, startedAt, places]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        firstPost: { type: string, enum: [hidden], description: 最初の Post が非公開 }
        replyCount:
          type: integer
          minimum: 0
          description: 公開の返信の数（公開の Post の数。最初の Post は非公開なので数に入っていない）
        startedAt:
          type: string
          format: date-time
          description: 会話の開始の時点（最初の Post の時点）
        lastPostedAt:
          type: string
          format: date-time
          description: 最後の公開の Post の時点。公開の Post がなければ返さない
        places:
          type: array
          description: 会話と場所の採用した紐付き（採用中・再検討中）。0件なら場所未定
          items: { $ref: '#/components/schemas/PlaceRef' }
    ConversationCardPage:
      type: object
      description: |
        会話カード（C40）の一覧。公開の会話だけ。**会話の開始の時点（startedAt）の新しい順**に、最大10件（固定）。
        同じ時点なら識別子の順。totalCount は公開の会話の全体の数。どの会話を集めるかは、使う項目の説明に書く。
        続きを取る API は、必要になったときに足す
      additionalProperties: false
      required: [items, totalCount]
      properties:
        items:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/ConversationCard' }
        totalCount: { type: integer, minimum: 0 }
    ProjectCard:
      type: object
      description: 企画カード（C29）。押すと企画のページ（S15）
      additionalProperties: false
      required: [id, title, type, creatorKind, creatorName, matchedBy]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        title: { type: string, minLength: 1 }
        type:
          type: string
          enum: [course, ranking, collection, memory]
          description: コース・番付・まとめ・記憶
        creatorKind:
          type: string
          enum: [operator, user]
          description: 運営の企画か、ユーザーの企画か（ユーザーの企画は「ex-day の認定ではありません」を添える）
        creatorName:
          type: string
          minLength: 1
          description: 作った人の今のニックネーム
        matchedBy:
          type: string
          enum: [discovery, place]
          description: |
            どの種類の項目で、ページの対象（Discovery・場所）に関わるか。決め方は、使う項目の説明に書く
            （S03：この Discovery を指す項目があれば discovery、なければ place。S13：この場所を指す項目があれば place、なければ discovery）
        position:
          type: integer
          minimum: 1
          description: |
            matchedBy の種類の項目のうち、いちばん前の項目の順番・順位。コース・番付のときだけ返す（まとめ・記憶は順番を出さない）
    ProjectCardPage:
      type: object
      description: |
        企画カード（C29）の一覧。公開の企画だけ（DB の visible_project_item で見える項目だけで判定する）。
        **企画ごとに1件**（複数の項目が当てはまっても重ねない）。**企画の作成の時点の新しい順**に、最大10件（固定）。
        同じ時点なら識別子の順。totalCount は公開の企画の全体の数。どの企画を集めるかは、使う項目の説明に書く
      additionalProperties: false
      required: [items, totalCount]
      properties:
        items:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/ProjectCard' }
        totalCount: { type: integer, minimum: 0 }
    DiscoveryRelations:
      type: object
      description: |
        関係する Discovery の3つの枠。該当がない枠は空の配列。公開で成立を取り消していない Discovery だけ（統合された側は出さない）。
        MVP では派生・関連は運営が手で決めるので、多くの Discovery では空になる。Subject を介した意味の関連は、後で足す。
        各枠は表題の順に最大10件（固定）
      additionalProperties: false
      required: [derivedFrom, derivedTo, related]
      properties:
        derivedFrom:
          type: array
          description: 派生元（この発見のもとになった Discovery）
          maxItems: 10
          items: { $ref: '#/components/schemas/DiscoverySummary' }
        derivedTo:
          type: array
          description: 派生した Discovery（この発見から広がった Discovery）
          maxItems: 10
          items: { $ref: '#/components/schemas/DiscoverySummary' }
        related:
          type: array
          description: 明示的に関連付けた Discovery
          maxItems: 10
          items: { $ref: '#/components/schemas/DiscoverySummary' }
    DiscoverySummary:
      type: object
      description: |
        Discovery のカード（C03）に出す要約。S01 の TOP の枠（TopDiscoveryCard の中）、S03 の関係する Discovery、S13 のここでの発見、
        S14 のこの会話から生まれた発見で使う
      additionalProperties: false
      required: [id, title, summary, displayPlaces]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        title: { type: string, minLength: 1 }
        summary: { type: string }
        displayPlaces:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PlaceRef' }
    # ---- S13 ----
    PlaceDetail:
      type: object
      additionalProperties: false
      required: [id, name, spatialType, kinds, aliases, state, capabilities, geometry, breadcrumb, estimates,
                 discoveries, seeking, conversations, projects, nearbyPlaces]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        name: { type: string, minLength: 1, description: 表示名 }
        spatialType: { $ref: '#/components/schemas/SpatialType' }
        kinds:
          type: array
          description: 場所の種類（城跡・公園・駅・坂 等）。値は足せる形にするため列挙しない。名前の順
          items: { type: string, minLength: 1 }
        aliases:
          type: array
          description: 別名・旧称（時代つき）。0件なら画面は出さない
          items: { $ref: '#/components/schemas/PlaceAlias' }
        existedPeriod:
          $ref: '#/components/schemas/Period'
          description: 存在した期間。今はない場所（昔の跨線橋）だけ。分からなければ返さない
        state: { $ref: '#/components/schemas/PlaceState' }
        capabilities: { $ref: '#/components/schemas/PlaceCapabilities' }
        geometry:
          $ref: '#/components/schemas/Geometry'
          description: 場所の形（小さな地図 C35 に出す）
        accessStation:
          $ref: '#/components/schemas/PlaceRef'
          description: 行き方の代表の駅（DEC-0013 決定2・3）。分からなければ返さない。駅から先の手段は DB に持っていないので返さない
        breadcrumb:
          type: array
          description: |
            場所の階層（「神奈川県 › 横浜市港北区 › 小机町」）。上位から順。この場所は含めない。
            上位は、場所どうしの関係の行政の階層（ADMINISTRATIVE）と地理的な包含（CONTAINS）を、この場所から上へたどって作る。
            1つの場所に上位が複数あるときは、行政の階層を先に、同じ種類なら識別子の順で最初のものをたどる。
            **この場所自身と、すでに通った場所は含めない**（循環していたら、そこでたどるのをやめる）。**たどるのは10段まで**で、
            上限に達したらそこまでを返す。0件のこともある
          maxItems: 10
          items: { $ref: '#/components/schemas/PlaceRef' }
        estimates:
          type: array
          description: この場所のデータ（推定の値と出どころ）。坂の勾配など。画面は「推定」と出どころを必ず添える。0件なら出さない
          items: { $ref: '#/components/schemas/PlaceEstimate' }
        discoveries: { $ref: '#/components/schemas/PlaceDiscoveryGroups' }
        seeking: { $ref: '#/components/schemas/SeekingCardPage' }
        conversations:
          $ref: '#/components/schemas/ConversationCardPage'
          description: |
            この場所の会話（C40）。この場所が採用されている（採用中・再検討中）公開の会話。入口＝この場所の会話も、始まりの時点で
            この場所が採用されるので含まれる。会話の開始の時点の新しい順に最大10件（固定）
        projects:
          $ref: '#/components/schemas/ProjectCardPage'
          description: |
            この場所が入っている企画（C29）。項目がこの場所、またはこの場所が関わる Discovery（公開）を指す、公開の企画。
            matchedBy は、この場所を指す項目があれば place、なければ discovery
        nearbyPlaces: { $ref: '#/components/schemas/NearbyPlacePage' }
    SpatialType:
      type: string
      enum: [point, area, route]
      description: 場所の形（地点・エリア・経路）。geometry の type と対応する（point は Point、route は LineString・MultiLineString、area は Polygon・MultiPolygon）
    PlaceAlias:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1 }
        kind:
          type: string
          enum: [alias, former]
          description: alias は別名、former は旧称
        period:
          $ref: '#/components/schemas/Period'
          description: その名前が使われた期間。分からなければ返さない
    PlaceState:
      description: |
        場所の状態。`status` で判別する。
        - active：有効
        - merged：統合済み。統合先への案内を出す（自動では移らない）。統合先がさらに統合されているときは、たどった最後の統合先を
          target にする。最後の統合先を決められない（循環している、深さの上限で止まった）ときは target を返さない
        - abolished：廃止。存在した期間があれば、そのまま表示する
      oneOf:
        - $ref: '#/components/schemas/ActivePlaceState'
        - $ref: '#/components/schemas/MergedPlaceState'
        - $ref: '#/components/schemas/AbolishedPlaceState'
    ActivePlaceState:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [active] }
    MergedPlaceState:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [merged] }
        target:
          $ref: '#/components/schemas/PlaceRef'
          description: 案内する統合先（たどった最後の統合先）。決められないときは返さない
    AbolishedPlaceState:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [abolished] }
    PlaceCapabilities:
      type: object
      description: |
        この場所に対して始められる操作（ログインの有無とは別に、対象として受け付けるか）。
        統合済みの場所では、新しい会話（話す）を受け付けず、統合先への案内に置き換える。廃止の場所では受け付ける（今はない場所の記憶を話せる）。
        「最初の声のお誘い」も、canStartConversation が true のときだけ出す
      additionalProperties: false
      required: [canStartConversation]
      properties:
        canStartConversation: { type: boolean }
    PlaceEstimate:
      type: object
      description: 場所の推定の値（データから計算した値）と、その計算の出どころ。ex-day の認定ではない
      additionalProperties: false
      required: [metric, value, unit, method, computedAt]
      properties:
        metric:
          type: string
          description: 何の値か（例：SLOPE_GRADE は坂の勾配）。値は足せる形にするため列挙しない。表示名は画面で決め、知らない値は出さない
          pattern: '^[A-Z][A-Z0-9_]*$'
          maxLength: 40
        value: { type: number, format: double }
        unit:
          type: string
          minLength: 1
          description: 単位（例：percent）
        method:
          type: string
          minLength: 1
          description: 計算の出どころ（例：elevation-x-road は標高データ × 道路）
        methodVersion: { type: string, minLength: 1 }
        computedAt: { type: string, format: date-time }
    PlaceDiscoveryGroups:
      type: object
      description: |
        ここでの発見。この場所が関わる（Discovery と場所の関係が有効な）、公開で成立を取り消しておらず、統合された側でない Discovery。
        **対象の選び方**：当てはまる Discovery を、成立の時点の新しい順（同じ時点なら識別子の順）に**30件（固定）まで選んでから**、
        観点ごとにまとめる（観点の名前の順で選ぶ対象が偏らないようにする）。全グループの items の合計は30件以下。
        **観点ごとにまとめる**（MVP の暫定の表示の決まり。2026-11-17 の人の判断、PR #153 のレビュー）：1つの Discovery は、
        観点（Subject の観点）の代表表記の順で最初の観点のグループに1回だけ入れる（同じ Discovery を複数の観点に重ねない）。
        これはドメインの「主な観点」を決める規則ではない（観点の優先度は人の興味・検索の目的・遷移元で変わり得る。S13 の将来の検討事項）。
        観点のない Discovery は、観点なしのグループに入れる。グループは観点の代表表記の順で、観点なしは最後。
        グループの中は、成立の時点の新しい順（同じ時点なら識別子の順）。同じ Discovery がこの場所に別の役割で関わっていても、1件にまとめて roles に並べる
      additionalProperties: false
      required: [groups, totalCount]
      properties:
        groups:
          type: array
          maxItems: 30
          items: { $ref: '#/components/schemas/PlaceDiscoveryGroup' }
        totalCount:
          type: integer
          minimum: 0
          description: 当てはまる Discovery の全体の数
    PlaceDiscoveryGroup:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        aspect:
          type: string
          minLength: 1
          description: 観点の代表表記。観点なしのグループでは返さない。観点が1つしかないときに見出しを省くかは画面で決める。グループごとに違う値
        items:
          type: array
          minItems: 1
          maxItems: 30
          items: { $ref: '#/components/schemas/PlaceDiscoveryCard' }
    PlaceDiscoveryCard:
      type: object
      description: ここでの発見のカード（C03）。この場所での役割を添える
      additionalProperties: false
      required: [discovery, roles]
      properties:
        discovery: { $ref: '#/components/schemas/DiscoverySummary' }
        roles:
          type: array
          description: この Discovery でのこの場所の役割（同じ場所が別の役割で関わることがある）。知らない値は画面で出さない
          minItems: 1
          items: { $ref: '#/components/schemas/DiscoveryPlaceRole' }
    SeekingCard:
      description: |
        このあたりで探している人がいます（C30）の1件分。場所がまだ決まっていない会話・問いで、この場所を検討中の候補に持つもの。
        `kind` で判別する。押すと会話のページ（S14）
        - conversation：会話の話の場所を探している（対象＝会話の場所の候補。その会話に採用中・再検討中の場所がない）
        - question：問いが場所を探している（対象＝問いの場所の候補。その問いに採用中・再検討中の回答がない）
      oneOf:
        - $ref: '#/components/schemas/SeekingConversationCard'
        - $ref: '#/components/schemas/SeekingQuestionCard'
    SeekingConversationCard:
      type: object
      additionalProperties: false
      required: [kind, conversation, candidates]
      properties:
        kind: { type: string, enum: [conversation] }
        conversation: { $ref: '#/components/schemas/ConversationCard' }
        candidates:
          type: array
          description: この場所に当てはまる、検討中の候補
          minItems: 1
          items: { $ref: '#/components/schemas/SeekingCandidate' }
    SeekingQuestionCard:
      type: object
      additionalProperties: false
      required: [kind, conversation, question, candidates]
      properties:
        kind: { type: string, enum: [question] }
        conversation:
          $ref: '#/components/schemas/ConversationCard'
          description: 問いが属する会話
        question: { $ref: '#/components/schemas/QuestionRef' }
        candidates:
          type: array
          description: この場所に当てはまる、検討中の候補
          minItems: 1
          items: { $ref: '#/components/schemas/SeekingCandidate' }
    QuestionRef:
      type: object
      description: 問い（ex-day が会話から見立てたもの）への参照
      additionalProperties: false
      required: [id, content]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        content: { type: string, minLength: 1, description: 問いの内容 }
    SeekingCandidate:
      description: |
        検討中の場所の候補。`kind` で判別する。
        - place：既存の場所（この場所）の候補
        - proposal：新しい場所の案で、おおよその位置がこの場所の範囲に入るもの（エリアの場所のときだけ）。採用されるまで場所ではない
      oneOf:
        - $ref: '#/components/schemas/ExistingPlaceCandidate'
        - $ref: '#/components/schemas/ProposedPlaceCandidate'
    ExistingPlaceCandidate:
      type: object
      additionalProperties: false
      required: [id, kind, place]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        kind: { type: string, enum: [place] }
        place: { $ref: '#/components/schemas/PlaceRef' }
    ProposedPlaceCandidate:
      type: object
      additionalProperties: false
      required: [id, kind, name]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        kind: { type: string, enum: [proposal] }
        name:
          type: string
          minLength: 1
          description: 新しい場所の案の名称（場所ではないので、識別子・座標は返さない）
    SeekingCardPage:
      type: object
      description: |
        このあたりで探している人がいます（C30）。公開の会話のものだけ（問いは、問いが属する会話が公開のもの）。
        会話・問いごとに1件（その会話・問いの、この場所に当てはまる検討中の候補を candidates に並べる）。
        **並び**：会話・問いごとに、当てはまる候補のうち最も新しく作られた候補の作成の時点の新しい順。同じ時点なら、
        会話（問いのカードは問い）の識別子の順。最大10件（固定）。totalCount は会話・問いの全体の数。
        candidates の中は、候補の作成の時点の古い順（同じ時点なら候補の識別子の順）
      additionalProperties: false
      required: [items, totalCount]
      properties:
        items:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/SeekingCard' }
        totalCount: { type: integer, minimum: 0 }
    NearbyPlace:
      type: object
      description: このあたりの場所（C28）の1件分
      additionalProperties: false
      required: [place, kinds]
      properties:
        place: { $ref: '#/components/schemas/PlaceRef' }
        kinds:
          type: array
          items: { type: string, minLength: 1 }
    NearbyPlacePage:
      type: object
      description: |
        このあたりの場所（C28）。場所どうしの関係（行政の階層・地理的な包含・観光や生活のエリア）で、この場所の中に入る場所のうち、
        ここでの発見（公開）か、この場所の会話（公開）がある場所だけ（空の受け皿の場所が並ばないようにする。ドメイン設計 3.3節）。
        位置から計算で導ける包含は使わず、保存した関係だけを使う（論理設計 4.2.1節）。直接の関係（1段）だけを使い、この場所自身は含めない。
        **名前の順（同じ名前なら識別子の順）**に最大20件（固定）。totalCount は当てはまる場所の全体の数
      additionalProperties: false
      required: [items, totalCount]
      properties:
        items:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/NearbyPlace' }
        totalCount: { type: integer, minimum: 0 }
    # ---- S14 会話のページ ----
    ConversationDetail:
      type: object
      description: S14（会話のページ）の内容。区画ごとの読み方は画面定義の「取得用 API で返すもの」
      additionalProperties: false
      required: [id, startedAt, publicPostCount, places, posts, placeCandidates, questions, findings, discoveries, reach]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        startedAt:
          type: string
          format: date-time
          description: 会話の開始の時点
        publicPostCount:
          type: integer
          minimum: 0
          description: 公開の Post の数（非公開の Post は数えない）。まだ読んでいない Post があるかは `posts.olderCursor` で分かる
        entry:
          $ref: '#/components/schemas/ConversationEntry'
          description: 入口。入口のない会話と、入口の Discovery・企画が見えない（非公開・成立の取り消し）ときは返さない
        places:
          type: array
          description: |
            場所の状態。会話と場所の採用した紐付き（採用中・再検討中。会話の採用と、会話の問いの回答の採用）。
            並びは順番、順番がなければ採用の時点の順（同じなら採用の識別子の順）。0件なら場所未定。上限なし
          items: { $ref: '#/components/schemas/ConversationPlaceItem' }
        posts: { $ref: '#/components/schemas/PostThread' }
        placeCandidates: { $ref: '#/components/schemas/PlaceCandidateSection' }
        questions: { $ref: '#/components/schemas/QuestionSection' }
        findings: { $ref: '#/components/schemas/FindingPage' }
        discoveries:
          $ref: '#/components/schemas/DiscoverySummaryPage'
          description: この会話から生まれた発見（由来＝この会話）。成立の新しい順
        reach: { $ref: '#/components/schemas/ReachPage' }
    ConversationEntry:
      description: 会話の入口。`kind` で判別する。押すと入口のページ
      oneOf:
        - $ref: '#/components/schemas/PlaceEntry'
        - $ref: '#/components/schemas/DiscoveryEntry'
        - $ref: '#/components/schemas/ProjectEntry'
    PlaceEntry:
      type: object
      description: 場所のページから始めた会話。入口の場所が統合済みでも、その場所を返す（S13 が統合先へ案内する）
      additionalProperties: false
      required: [kind, place]
      properties:
        kind: { type: string, enum: [place] }
        place: { $ref: '#/components/schemas/PlaceRef' }
    DiscoveryEntry:
      type: object
      description: Discovery のページから始めた会話。入口の Discovery が統合されていれば、最後の統合先を返す（S03 と同じ決まり）
      additionalProperties: false
      required: [kind, discovery]
      properties:
        kind: { type: string, enum: [discovery] }
        discovery: { $ref: '#/components/schemas/DiscoveryRef' }
    ProjectEntry:
      type: object
      additionalProperties: false
      required: [kind, project, relation]
      properties:
        kind: { type: string, enum: [project] }
        project: { $ref: '#/components/schemas/ProjectRef' }
        relation:
          type: string
          enum: [own, triggered]
          description: own は企画そのものの会話、triggered は企画をきっかけにした会話
    ProjectRef:
      type: object
      description: 企画への参照。押すと企画のページ（S15）
      additionalProperties: false
      required: [id, title]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        title: { type: string, minLength: 1 }
    ConversationPlaceRole:
      type: string
      description: |
        会話の場所の役割のコード値（DB の place_adoption.role）。足せる形にするため閉じた列挙にしない。
        画面は知っている値に表示名を当て、知らない値は役割の名前を出さずに出す

        | 値 | 意味 |
        |---|---|
        | START | 始まり |
        | VIA | 経由 |
        | END | 終わり |
        | TOPIC | 話の場所 |
      pattern: '^[A-Z][A-Z0-9_]*$'
      maxLength: 40
    AdoptionStatus:
      type: string
      enum: [adopted, reconsidering]
      description: 採用の状態。adopted は「採用」、reconsidering は「新しい情報が寄せられ、再検討中」（「確定」「解決済み」と言わない）
    AdoptionActor:
      type: string
      enum: [questionOwner, conversationStarter, ruleOrOperator]
      description: |
        採用した主体。questionOwner は問いを立てた人（「投稿者が採用した回答」）、conversationStarter は会話を始めた人、
        ruleOrOperator は ex-day の規則・運営（「現在の回答」）
    ConversationPlaceItem:
      type: object
      additionalProperties: false
      required: [place, status, source]
      properties:
        place: { $ref: '#/components/schemas/PlaceRef' }
        role: { $ref: '#/components/schemas/ConversationPlaceRole' }
        order: { type: integer, minimum: 1, description: 順番（散歩の道順など）。順番のない採用では返さない }
        status: { $ref: '#/components/schemas/AdoptionStatus' }
        source:
          type: string
          enum: [conversation, question]
          description: conversation は会話の場所の採用、question は会話の問いの回答として採用した場所
    # ---- Post ----
    PostCursor:
      type: string
      description: 「これまでのやりとりを見る」のカーソル。画面は中身を解釈せず、そのまま `before` に渡す
      pattern: '^[0-9A-Za-z]{12}$'
      minLength: 12
      maxLength: 12
    PostItem:
      description: |
        会話の Post（C26）。`visibility` で判別する。非公開の Post は、識別子・時点・返信先だけを返し、本文と書いた人を返さない
        （画面は「この声は表示されていません」と出し、流れの位置を保つ）
      oneOf:
        - $ref: '#/components/schemas/VisiblePost'
        - $ref: '#/components/schemas/HiddenPost'
    VisiblePost:
      type: object
      additionalProperties: false
      required: [id, visibility, body, authorName, postedAt, replyTo, reactions]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        visibility: { type: string, enum: [visible] }
        body: { type: string, minLength: 1 }
        authorName:
          type: string
          minLength: 1
          description: 書いた人の今のニックネーム（表示のたびに引く。Issue #74）
        postedAt: { type: string, format: date-time }
        replyTo:
          type: array
          description: 返信先の Post（同じ会話の中）。返信先が非公開の Post でも識別子を返す
          items: { $ref: '#/components/schemas/PublicId' }
        reactions:
          type: object
          additionalProperties: false
          required: [empathy]
          properties:
            empathy: { type: integer, minimum: 0, description: 共感 }
    HiddenPost:
      type: object
      additionalProperties: false
      required: [id, visibility, postedAt, replyTo]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        visibility: { type: string, enum: [hidden] }
        postedAt: { type: string, format: date-time }
        replyTo:
          type: array
          items: { $ref: '#/components/schemas/PublicId' }
    PostThread:
      type: object
      description: |
        会話の Post。最初の Post（`first`）と、それに続く新しい Post（`recent`。最大 `postLimit` 件、古い順）。
        `first` と `recent` の間に Post が残っていれば `olderCursor` を返す（getConversationPosts に渡す）。
        並びは投稿の時点の古い順、同じ時点なら識別子の順。非公開の Post の枠も件数に数える
      additionalProperties: false
      required: [first, recent]
      properties:
        first: { $ref: '#/components/schemas/PostItem' }
        recent:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/PostItem' }
        olderCursor: { $ref: '#/components/schemas/PostCursor' }
    OlderPostPage:
      type: object
      description: カーソルより前の Post（古い順。最初の Post は含めない）。さらに前が残っていれば `olderCursor` を返す
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/PostItem' }
        olderCursor: { $ref: '#/components/schemas/PostCursor' }
    # ---- 場所の候補と採用（C33） ----
    PlaceCandidateSection:
      type: object
      description: |
        場所の候補と採用（C33）。対象がこの会話、またはこの会話の問いの候補。
        **今の採用（採用中・再検討中）がある候補を `adopted` に全部**入れ（件数の上限で欠けない）、ほかの候補を `others` に入れる。
        採用は真実の確定ではなく、再検討になりうる（再検討中も adopted に入れ、状態で見分ける）。
        候補は消さずに蓄積し、件数を制限しない（`others` は見せる数の上限で、蓄積の上限ではない）

        - `adopted` の並び：採用の順番（順番のない採用は後）、次に候補の作成の時点、同じなら識別子の順
        - `others` の並び：検討中を先に、次に不採用・失効・取り消しのもの。それぞれ候補の作成の時点の古い順、同じなら識別子の順。
          最大50件（暫定。データが育ってから見直す）。`othersTotalCount` はほかの候補の全体の数。
          50件を超えたときの見方は、データが増えた段階で決める
      additionalProperties: false
      required: [adopted, others, othersTotalCount]
      properties:
        adopted:
          type: array
          items: { $ref: '#/components/schemas/PlaceCandidateItem' }
        others:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/PlaceCandidateItem' }
        othersTotalCount: { type: integer, minimum: 0 }
    PlaceCandidateItem:
      type: object
      additionalProperties: false
      required: [id, target, place, status, basisPostIds, voices]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        target: { $ref: '#/components/schemas/CandidateTarget' }
        place: { $ref: '#/components/schemas/CandidatePlace' }
        status:
          type: string
          enum: [considering, rejected, expired]
          description: |
            候補の状態（検討中・不採用・失効）。採用は候補の状態ではなく `adoption` で見る
            （採用された候補も、不採用・失効にならない限り considering のまま）
        adoption: { $ref: '#/components/schemas/CandidateAdoption' }
        basisPostIds:
          type: array
          description: 根拠の Post（作成の時点の古い順）。非公開の Post でも識別子を返す（PostItem の HiddenPost を指す）
          items: { $ref: '#/components/schemas/PublicId' }
        voices:
          type: object
          additionalProperties: false
          required: [support, oppose]
          properties:
            support: { type: integer, minimum: 0, description: ここかも }
            oppose: { type: integer, minimum: 0, description: 違うと思う }
    CandidateTarget:
      description: 候補の対象。`kind` で判別する
      oneOf:
        - $ref: '#/components/schemas/ConversationCandidateTarget'
        - $ref: '#/components/schemas/QuestionCandidateTarget'
    ConversationCandidateTarget:
      type: object
      description: この会話の話の場所の候補
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [conversation] }
    QuestionCandidateTarget:
      type: object
      description: この会話の問い（場所を探す問い）の回答の候補
      additionalProperties: false
      required: [kind, questionId]
      properties:
        kind: { type: string, enum: [question] }
        questionId: { $ref: '#/components/schemas/PublicId' }
    CandidatePlace:
      description: 候補の場所。`kind` で判別する（既存の場所か、新しい場所の案か）
      oneOf:
        - $ref: '#/components/schemas/CandidateExistingPlace'
        - $ref: '#/components/schemas/CandidateProposedPlace'
    CandidateExistingPlace:
      type: object
      additionalProperties: false
      required: [kind, place]
      properties:
        kind: { type: string, enum: [place] }
        place: { $ref: '#/components/schemas/PlaceRef' }
    CandidateProposedPlace:
      type: object
      description: |
        新しい場所の案（採用されるまで場所ではないので、場所のページを持たない）。形は、会話の中の地図に出すため返す
        （案の名前・位置を場所の検索・場所の地図に混ぜないのは DB 設計 3.8節のとおり）
      additionalProperties: false
      required: [kind, name, kinds]
      properties:
        kind: { type: string, enum: [proposal] }
        name: { type: string, minLength: 1 }
        spatialType: { $ref: '#/components/schemas/SpatialType' }
        geometry:
          $ref: '#/components/schemas/Geometry'
          description: 案の位置・形。名前だけの案では返さない
        kinds:
          type: array
          description: 案の種類（店・駅 等）
          items: { type: string, minLength: 1 }
        existedPeriod: { $ref: '#/components/schemas/Period' }
    CandidateAdoption:
      description: |
        候補の今の採用の状態。`status` で判別する。今の採用（採用中・再検討中）があればその状態、なければ最後の採用の取り消し。
        採用されたことのない候補では返さない。採用・取り消しの履歴の全部（判断の記録）は、一般のユーザー向けには返さない
      oneOf:
        - $ref: '#/components/schemas/ActiveCandidateAdoption'
        - $ref: '#/components/schemas/ReconsideringCandidateAdoption'
        - $ref: '#/components/schemas/RevokedCandidateAdoption'
    ActiveCandidateAdoption:
      type: object
      additionalProperties: false
      required: [status, adoptedBy]
      properties:
        status: { type: string, enum: [adopted] }
        adoptedBy: { $ref: '#/components/schemas/AdoptionActor' }
    ReconsideringCandidateAdoption:
      type: object
      additionalProperties: false
      required: [status, adoptedBy]
      properties:
        status: { type: string, enum: [reconsidering] }
        adoptedBy: { $ref: '#/components/schemas/AdoptionActor' }
    RevokedCandidateAdoption:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status: { type: string, enum: [revoked] }
        reason:
          type: string
          enum: [readopted, withdrawn, merged]
          description: readopted は別の場所を採用し直した、withdrawn は採用を取り消した、merged は問いの統合で統合先へ移した
    # ---- 問いと回答の採用（C34） ----
    QuestionSection:
      type: object
      description: |
        この会話の問い（C34）。**採用中・再検討中の回答がある問いを `answered` に全部**入れ（件数の上限で欠けない）、ほかの問い
        （回答のない有効な問いと、失効した問い）を `others` に入れる。問いは消さずに蓄積し、件数を制限しない。
        統合された問いは出さず、統合先が別の会話なら `moved` で案内する（統合先が同じ会話なら何も出さない）

        - `answered` の並び：作成の時点の古い順、同じなら識別子の順
        - `others` の並び：有効な問いを先に、次に失効した問い。それぞれ作成の時点の古い順、同じなら識別子の順。
          最大20件（暫定）。`othersTotalCount` はほかの問いの全体の数。20件を超えたときの見方は、データが増えた段階で決める
      additionalProperties: false
      required: [answered, others, othersTotalCount, moved]
      properties:
        answered:
          type: array
          items: { $ref: '#/components/schemas/QuestionItem' }
        others:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/QuestionItem' }
        othersTotalCount: { type: integer, minimum: 0 }
        moved:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/MovedItem' }
    QuestionItem:
      type: object
      additionalProperties: false
      required: [id, content, kind, status, askedByPerson, reactions]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        content: { type: string, minLength: 1 }
        kind:
          type: string
          enum: [where, why, what, other]
          description: 問いの種類（どこ・なぜ・何・ほか）
        status:
          type: string
          enum: [active, expired]
          description: 有効か、失効したか
        askedByPerson:
          type: boolean
          description: 問いを立てた人がいるか（false なら、会話から読み取った問い。回答を採用するのは ex-day の規則・運営）
        keepOpen:
          type: boolean
          description: 問いを立てた人が「引き続き募集する」にしているか。設定がなければ返さない
        answer: { $ref: '#/components/schemas/QuestionAnswer' }
        reactions:
          type: object
          additionalProperties: false
          required: [curious]
          properties:
            curious: { type: integer, minimum: 0, description: 自分も気になる }
    QuestionAnswer:
      description: |
        採用中・再検討中の回答。`kind` で判別する。回答がなければ返さない。
        場所を探す問いは採用した場所、ほかの問いは回答の Post かわかってきたこと
      oneOf:
        - $ref: '#/components/schemas/PlaceQuestionAnswer'
        - $ref: '#/components/schemas/PostQuestionAnswer'
        - $ref: '#/components/schemas/FindingQuestionAnswer'
    PlaceQuestionAnswer:
      type: object
      additionalProperties: false
      required: [kind, status, adoptedBy, place]
      properties:
        kind: { type: string, enum: [place] }
        status: { $ref: '#/components/schemas/AdoptionStatus' }
        adoptedBy: { $ref: '#/components/schemas/AdoptionActor' }
        place: { $ref: '#/components/schemas/PlaceRef' }
    PostQuestionAnswer:
      type: object
      additionalProperties: false
      required: [kind, status, adoptedBy, post]
      properties:
        kind: { type: string, enum: [post] }
        status: { $ref: '#/components/schemas/AdoptionStatus' }
        adoptedBy: { $ref: '#/components/schemas/AdoptionActor' }
        post: { $ref: '#/components/schemas/AnswerPostRef' }
    AnswerPostRef:
      description: |
        回答の Post への参照。`state` で判別する。回答の採用と、参照先の公開状態は独立している（採用は取り消されていない）。
        Post が非公開でも、属する会話が公開なら識別子を返す（会話の Post の HiddenPost を指す。本文は返さない）。
        属する会話が非公開なら、参照できないことだけを返す
      oneOf:
        - $ref: '#/components/schemas/AvailableAnswerPostRef'
        - $ref: '#/components/schemas/UnavailableAnswerRef'
    AvailableAnswerPostRef:
      type: object
      additionalProperties: false
      required: [state, id, conversationId]
      properties:
        state: { type: string, enum: [available] }
        id: { $ref: '#/components/schemas/PublicId' }
        conversationId:
          $ref: '#/components/schemas/PublicId'
          description: Post が属する会話（ふつうはこの会話）
    FindingQuestionAnswer:
      type: object
      additionalProperties: false
      required: [kind, status, adoptedBy, finding]
      properties:
        kind: { type: string, enum: [finding] }
        status: { $ref: '#/components/schemas/AdoptionStatus' }
        adoptedBy: { $ref: '#/components/schemas/AdoptionActor' }
        finding: { $ref: '#/components/schemas/AnswerFindingRef' }
    AnswerFindingRef:
      description: |
        回答のわかってきたことへの参照。`state` で判別する。回答の採用と、参照先の状態・公開可否は独立している
        （参照先が統合・失効・非公開になっても、採用の取り消しとは扱わない。`unavailable` でも回答の状態はそのまま返す）。

        **公開できるかを、次の2つの両方について確かめる**。どちらかが公開できなければ `unavailable` とし、
        内容・識別子・会話・理由を返さない（統合先の識別子からたどれる情報も漏らさない）。

        1. **採用した版**（回答として採用したときの版）の内容
        2. **案内する先**：統合されていなければそのわかってきたこと自身、統合されていれば最後の統合先
           （循環・深さの上限で決められないときは、統合された側そのもの）

        公開できるかは、一般のユーザー向けの公開の読み取りの定義（DB の visible_* のビュー。DB 設計 2.5節）で判断する。
        今は、わかってきたことの公開可否は属する会話の公開状態から決まる。わかってきたこと自身・版ごとの非公開（公開できない内容が
        採用した版に残っている場合を含む）は、F02・F10 で公開制御・再解析の仕組みを決めて足す（外部公開の前に確定する）。
        足したときも、この約束事（どちらかが公開できなければ unavailable）は変えない。

        - `available`：`text` は採用した版の内容（今の版ではない）、`id`・`conversationId` は案内する先。失効していても参照できる
        - `unavailable`：参照できないことだけを返す
      oneOf:
        - $ref: '#/components/schemas/AvailableAnswerFindingRef'
        - $ref: '#/components/schemas/UnavailableAnswerRef'
    AvailableAnswerFindingRef:
      type: object
      additionalProperties: false
      required: [state, id, conversationId, text]
      properties:
        state: { type: string, enum: [available] }
        id: { $ref: '#/components/schemas/PublicId' }
        conversationId:
          $ref: '#/components/schemas/PublicId'
          description: 案内する先のわかってきたことが属する会話
        text: { type: string, minLength: 1, description: 採用した版の内容 }
    UnavailableAnswerRef:
      type: object
      description: 回答の参照先を一般のユーザーに見せられない（採用は取り消されていない）
      additionalProperties: false
      required: [state]
      properties:
        state: { type: string, enum: [unavailable] }
    MovedItem:
      type: object
      description: 統合されて別の会話へ移ったもの（問い・わかってきたこと）。押すと統合先の会話のページ
      additionalProperties: false
      required: [id, conversationId]
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
          description: 統合された側の識別子
        conversationId:
          $ref: '#/components/schemas/PublicId'
          description: 最後の統合先が属する会話（公開の会話だけ。見えないときは moved に入れない）
    # ---- わかってきたこと（C25） ----
    FindingCursor:
      type: string
      description: わかってきたことの続きを読むカーソル。画面は中身を解釈せず、そのまま `after` に渡す
      pattern: '^[0-9A-Za-z]{12}$'
      minLength: 12
      maxLength: 12
    FindingPage:
      type: object
      description: |
        この会話のわかってきたこと（C25）。有効なものの今の版。わかってきたことは発見の成立のあとも消さずに蓄積し、件数を制限しない。
        統合された側は出さず、統合先が別の会話なら `moved` で案内する。

        - **並び**：できた時点（createdAt）の古い順、同じなら識別子の順（安定した並び）。版が新しくなっても並びの位置は変わらない。
          新しいものと更新されたものは `createdAt`・`updatedAt`・`version` で見分ける
        - **件数**：getConversation では `findingLimit` 件（暫定の既定値20）、getConversationFindings では `limit` 件。
          続きがあれば `nextCursor` を返す（getConversationFindings の `after` に渡す）。カーソルは並びのキーで比べるので、
          読んでいる間に新しいわかってきたことができても、範囲がずれない（新しいものは並びの最後に足される）
        - `totalCount` は有効なわかってきたことの全体の数。`moved` は getConversation だけで返す（続きの読み込みでは空）
        - 初回の件数・並び・更新の見せ方は、データが育ってから見直す（S14 の判断待ち）
      additionalProperties: false
      required: [items, totalCount, moved]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/FindingItem' }
        totalCount: { type: integer, minimum: 0 }
        nextCursor: { $ref: '#/components/schemas/FindingCursor' }
        moved:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/MovedItem' }
    # ---- この会話から生まれた発見（C03）・届くところ ----
    DiscoverySummaryPage:
      type: object
      description: |
        Discovery のカード（C03）の一覧。公開で成立を取り消していない Discovery だけ。統合された側は出さず、最後の統合先を出す
        （同じものは1件。件数は統合先を解決してから数える）。最大10件（固定）。totalCount は全体の数。並びは使う項目の説明に書く
      additionalProperties: false
      required: [items, totalCount]
      properties:
        items:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/DiscoverySummary' }
        totalCount: { type: integer, minimum: 0 }
    ReachPage:
      type: object
      description: |
        この会話が届くところ。S13 の「このあたりで探している人がいます」と同じ当てはめで、この会話・この会話の問いのカードが出ている
        場所のページ。対象が会話の候補は会話の場所が決まっていないときだけ、対象が問いの候補は問いが有効で回答が採用されていないとき
        （会話の場所が採用済みでも出る）。既存の場所の候補はその場所、新しい場所の案は案の位置を含むエリアの場所（重なるものは全部）。
        並びは既存の場所の候補を先に、次にエリアの小さい順（同じなら識別子の順）。同じ場所は1件。最大20件（固定）。totalCount は全体の数。
        TOP の「探しています」・投稿した人の「自分の話」は画面が出す
      additionalProperties: false
      required: [items, totalCount]
      properties:
        items:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ReachPlace' }
        totalCount: { type: integer, minimum: 0 }
    ReachPlace:
      type: object
      additionalProperties: false
      required: [place, matchedBy]
      properties:
        place: { $ref: '#/components/schemas/PlaceRef' }
        matchedBy:
          type: string
          enum: [candidate, area]
          description: candidate はこの場所が候補の場所、area は新しい場所の案の位置がこのエリアに入る
    # ---- S01 TOP ----
    TopPage:
      type: object
      description: TOP（S01）の全部の枠。起点・小さな地図・このあたりの数字は枠の並びの外（画面の決まった場所に出す）
      additionalProperties: false
      required: [now, season, origin, smallMap, areaCounts, sections]
      properties:
        now:
          type: string
          format: date-time
          description: 枠を選ぶのに使った「今」（Asia/Tokyo）
        season: { $ref: '#/components/schemas/CurrentSeason' }
        origin: { $ref: '#/components/schemas/TopOrigin' }
        smallMap: { $ref: '#/components/schemas/TopSmallMap' }
        areaCounts: { $ref: '#/components/schemas/TopAreaCounts' }
        sections:
          type: array
          description: 中身のある枠だけを F01 の優先の順で。同じ kind の枠は1回だけ（重ならないことは説明で約束する）。items の合計は50件以下
          maxItems: 8
          items: { $ref: '#/components/schemas/TopSection' }
    TopOrigin:
      type: object
      description: 起点。画面は「[起点]から、往復2時間で寄れるところ」など、起点の名前を必ず添える
      additionalProperties: false
      required: [place, source, outsideStartArea]
      properties:
        place: { $ref: '#/components/schemas/PlaceRef' }
        source:
          type: string
          enum: [requested, default]
          description: requested は `from` で受けた場所（統合先をたどったもの）、default は既定の起点（始める地域の中の場所。アプリの設定）
        outsideStartArea:
          type: boolean
          description: |
            起点が始める地域の場所そのもの、行政の祖先に始める地域の場所がある、または始める地域の形が起点の形を覆う、のどれでもなければ true
            （始める地域の外のお知らせを出す）
        adminArea:
          $ref: '#/components/schemas/PlaceRef'
          description: |
            同じ行政の地域（いま・この時期の「同じ行政の地域」の段に使う）。起点が「市区町村」の AREA なら起点そのもの。
            それ以外は最も近い行政の祖先（区、なければ市）：場所どうしの関係（ADMINISTRATIVE・CONTAINS・AREA）を親へたどり、種類が
            「市区町村」の近い親。たどれる親がなければ、形が起点の形を覆う「市区町村」の場所のうち面の小さいもの。どれもなければ返さない
    TopSmallMap:
      type: object
      description: |
        小さな地図の条件。押すと S12 を `from`＝起点、`t`＝minutes、`to` を省いて（往復）開く（S01「小さな地図と S12 の条件」）。
        帯の形（そこで何分過ごせるか）は F06 ができてから足す。そのときに、計算の起点の駅、計算できない状態、起点から駅までの移動を
        含まないことなどの注意も足す
      additionalProperties: false
      required: [minutes, trip]
      properties:
        minutes:
          type: integer
          minimum: 30
          maximum: 480
          description: 使える時間（分）。TOP の既定は 120（S12 の範囲は 30〜480分・15分刻みの案）
        trip:
          type: string
          enum: [round_trip]
          description: 終点の条件。TOP の小さな地図は往復だけ（S12 で `to` を省く）
    TopAreaCounts:
      type: object
      description: |
        このあたりの数字（「このあたり：場所 [N]・声のある発見 [N]」）。どちらも近く（getTop の説明。起点の形で分ける）で数える。
        **声のある発見**：公開の Discovery のうち、由来に公開の会話（visible_conversation）または公開の Post（visible_post）に届くものを持つもの。
        由来がいくつあっても1件。運営の登録だけを由来に持つものは数えない（運営の登録に加えて公開の会話・Post の由来も持つものは数える）。
        非公開の会話・Post だけを由来に持つものは数えない。この定義は数字にだけ使い、枠の対象を狭めない
      additionalProperties: false
      required: [placeCount, voicedDiscoveryCount]
      properties:
        placeCount:
          type: integer
          minimum: 0
          description: 近くの場所（ACTIVE。起点自身と、起点を含む上位の場所を除く）の数
        voicedDiscoveryCount:
          type: integer
          minimum: 0
          description: 近くの場所を持つ声のある発見の数
    TopSection:
      description: |
        TOP の枠。`kind` で判別する
        - outside_start_area：始める地域の外のお知らせ（起点が始める地域の外のときだけ）
        - seasonal：いま・この時期
        - nearby_discoveries：近くの発見
        - projects：企画
        - estimates：番付（推定）
        - examples：ex-day の発見（見本）
        - seeking：探しています
        - awaiting_voices：声を待っている
      oneOf:
        - $ref: '#/components/schemas/OutsideStartAreaSection'
        - $ref: '#/components/schemas/SeasonalSection'
        - $ref: '#/components/schemas/NearbyDiscoverySection'
        - $ref: '#/components/schemas/TopProjectSection'
        - $ref: '#/components/schemas/EstimateSection'
        - $ref: '#/components/schemas/ExampleSection'
        - $ref: '#/components/schemas/TopSeekingSection'
        - $ref: '#/components/schemas/AwaitingVoicesSection'
    TopDiscoveryCard:
      type: object
      description: |
        TOP の Discovery のカード（C03）。場所を見出しにして出す（「小机城址：春は…」）。見出しは nearestPlace。
        `isExample` が true なら、どの枠に出ても「ex-day の発見（見本）」と分かるように出す
      additionalProperties: false
      required: [discovery, nearestPlace, distanceMeters, isExample]
      properties:
        discovery: { $ref: '#/components/schemas/DiscoverySummary' }
        nearestPlace:
          $ref: '#/components/schemas/PlaceRef'
          description: この Discovery が関わる（関係が有効な）場所のうち、起点の形にいちばん近い場所（同じ距離なら場所の識別子の順）
        distanceMeters:
          type: integer
          minimum: 0
          description: 起点の形と nearestPlace の形の最短の直線の距離（メートル、四捨五入）。AREA の起点の中・交わるものは 0。画面で 0m を出すかは画面で決める
        isExample:
          type: boolean
          description: 由来に運営の登録（OPERATOR）を持つ。見本の表示を付ける（品質や正しさの区別ではない）
    OutsideStartAreaSection:
      type: object
      description: |
        始める地域の外のお知らせ。画面は「このあたりはまだ発見が少ない」と書き、nearestDiscovery を寄り道の入口として出す（DEC-0022 決定3）。
        nearestDiscovery は、公開の Discovery のうち起点にいちばん近いもの（同じ距離なら Discovery の識別子の順）。公開の Discovery がなければ枠を返さない
      additionalProperties: false
      required: [kind, nearestDiscovery]
      properties:
        kind: { type: string, enum: [outside_start_area] }
        nearestDiscovery: { $ref: '#/components/schemas/TopDiscoveryCard' }
    SeasonalSection:
      type: object
      description: |
        いま・この時期。季節の条件が「今」の季節に合う Value（通年は含めない）を持つ公開の Discovery。広げ方：
        1. 近く（getTop の説明。起点の形で分ける）：距離の順に、配られた数まで
        2. 同じ行政の地域（origin.adminArea の形と交わる、または関係で子孫にあたる場所を持つもの）：足りなければ、1 で出したものを除いて
           距離の順に補う。adminArea がなければ飛ばす
        3. 全国：1・2 で1件もなければ、全国から距離の順に2件まで（画面は「今の時期ならこんな発見も」を出す）
        並びは段の順、段の中は距離の順（同じ距離なら Discovery の識別子の順）
      additionalProperties: false
      required: [kind, items, hasMore]
      properties:
        kind: { type: string, enum: [seasonal] }
        items:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: '#/components/schemas/SeasonalDiscoveryCard' }
        hasMore: { type: boolean }
    SeasonalDiscoveryCard:
      type: object
      additionalProperties: false
      required: [card, value, scope]
      properties:
        card: { $ref: '#/components/schemas/TopDiscoveryCard' }
        value:
          $ref: '#/components/schemas/TopSeasonalValue'
          description: 今の季節に合う Value。複数あれば作った時点の古いもの（同じなら Value の識別子の順）
        scope:
          type: string
          enum: [nearby, admin_area, nationwide]
          description: どの段で見つけたか（近く／同じ行政の地域／全国）
    TopSeasonalValue:
      type: object
      description: 今成立する価値（カードに添える短い説明）
      additionalProperties: false
      required: [id, description]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        description: { type: string, minLength: 1 }
    NearbyDiscoverySection:
      type: object
      description: 近くの発見。近くの場所を持つ公開の Discovery（由来を問わない）。距離の順（同じ距離なら Discovery の識別子の順）
      additionalProperties: false
      required: [kind, items, hasMore]
      properties:
        kind: { type: string, enum: [nearby_discoveries] }
        items:
          type: array
          minItems: 1
          maxItems: 12
          items: { $ref: '#/components/schemas/TopDiscoveryCard' }
        hasMore: { type: boolean }
    TopProjectSection:
      type: object
      description: |
        企画。公開の企画を、作った時点の新しい順（同じなら識別子の降順。S17 の new と同じ）。地域では絞らない（暫定）。
        「もっと見る」は条件なしで S17。「こんな番付、作ってみませんか？」は画面が出す
      additionalProperties: false
      required: [kind, items, hasMore]
      properties:
        kind: { type: string, enum: [projects] }
        items:
          type: array
          minItems: 1
          maxItems: 6
          items: { $ref: '#/components/schemas/ProjectListCard' }
        hasMore: { type: boolean }
    EstimateSection:
      type: object
      description: |
        番付（推定）。近くの場所（起点自身と上位の場所を除く）の推定の値を、指標ごとにまとめる。指標は名前（metric）の順に2つまで、指標の中は値の大きい順に3件まで
        （同じ値なら場所の識別子の順）。配る数は items の合計で数える。画面は「推定」と出どころ（method）を必ず添え、ex-day の認定に見せない
      additionalProperties: false
      required: [kind, groups, hasMore]
      properties:
        kind: { type: string, enum: [estimates] }
        groups:
          type: array
          minItems: 1
          maxItems: 2
          items: { $ref: '#/components/schemas/EstimateGroup' }
        hasMore:
          type: boolean
          description: 出していない場所・指標があれば true
    EstimateGroup:
      type: object
      additionalProperties: false
      required: [metric, items]
      properties:
        metric:
          type: string
          description: PlaceEstimate の metric と同じ。グループごとに違う値
          pattern: '^[A-Z][A-Z0-9_]*$'
          maxLength: 40
        items:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: '#/components/schemas/EstimatedPlace' }
    EstimatedPlace:
      type: object
      additionalProperties: false
      required: [place, estimate]
      properties:
        place: { $ref: '#/components/schemas/PlaceRef' }
        estimate: { $ref: '#/components/schemas/PlaceEstimate' }
    ExampleSection:
      type: object
      description: |
        ex-day の発見（見本）。運営の登録を由来に持つ公開の Discovery のうち、先の枠に出なかったもの。
        起点から近い順（同じ距離なら Discovery の識別子の順）。近くになければ、遠いもの（始める地域のもの）が続く。items の isExample はすべて true
      additionalProperties: false
      required: [kind, items, hasMore]
      properties:
        kind: { type: string, enum: [examples] }
        items:
          type: array
          minItems: 1
          maxItems: 6
          items: { $ref: '#/components/schemas/TopDiscoveryCard' }
        hasMore: { type: boolean }
    TopSeekingSection:
      type: object
      description: |
        探しています（C30）。場所が決まっていない話を、公開の会話ごとに1件。対象は次のどちらかを持つ会話：
        答えの出ていない「どこ」の問い（有効で、回答が採用中・再検討中でない。S14 の問いの区画と同じ決まり）、
        または会話の場所が採用中・再検討中でなく、検討中の場所の候補。
        並び：近くに検討中の候補を持つ会話を先に、その中は最も近い候補の距離の順（nearestCandidateDistanceMeters）。近くに候補のない会話は、会話の作った時点の新しい順。
        同じなら会話の識別子の順
      additionalProperties: false
      required: [kind, items, hasMore]
      properties:
        kind: { type: string, enum: [seeking] }
        items:
          type: array
          minItems: 1
          maxItems: 6
          items: { $ref: '#/components/schemas/TopSeekingCard' }
        hasMore: { type: boolean }
    TopSeekingCard:
      type: object
      description: |
        探していますの1件分（会話ごと）。押すと会話のページ（S14）。問いの対象の会話は questions を、候補の対象の会話は candidates を
        少なくとも1件持つ
      additionalProperties: false
      required: [conversation, questions, candidates]
      properties:
        conversation: { $ref: '#/components/schemas/ConversationCard' }
        questions:
          type: array
          description: 答えの出ていない「どこ」の問い。作った時点の古い順に3件まで（同じなら問いの識別子の順）。なければ空
          maxItems: 3
          items: { $ref: '#/components/schemas/QuestionRef' }
        candidates:
          type: array
          description: |
            検討中の場所の候補（会話の候補と、答えの出ていない問いの候補）。起点の形に近い順に3件まで（位置のない新しい場所の案は後ろ。
            同じなら候補の識別子の順）。なければ空
          maxItems: 3
          items: { $ref: '#/components/schemas/SeekingCandidate' }
        nearestCandidateDistanceMeters:
          type: integer
          minimum: 0
          description: 近く（getTop の説明）に候補があるとき、起点の形といちばん近い候補の形との距離（メートル）。なければ返さない
    AwaitingVoicesSection:
      type: object
      description: |
        声を待っている。近くの ACTIVE な場所（起点自身と、起点を含む上位の場所を除く）で、公開の会話（会話と場所の採用した紐付き）も公開の Discovery（関係が有効なもの）もないもの。
        種類では除かない。距離の順（同じ距離なら場所の識別子の順）。画面は「この場所の昔を、知っていますか？」を添える
      additionalProperties: false
      required: [kind, items, hasMore]
      properties:
        kind: { type: string, enum: [awaiting_voices] }
        items:
          type: array
          minItems: 1
          maxItems: 6
          items: { $ref: '#/components/schemas/NearbyPlace' }
        hasMore: { type: boolean }
    # ---- S17 企画の一覧 ----
    ProjectCreatorKind:
      type: string
      enum: [operator, user]
      description: 企画を作った人の種類（運営／ユーザー）
    ProjectListSort:
      type: string
      enum: [new]
      default: new
      description: 企画の一覧の並べ方。new は新しい順。「新しい声の多い順」は、集計の期間・方式を決めてから値を足す
    ProjectListCursor:
      type: string
      description: |
        企画の一覧の続きを読むカーソル。並びのキーと、作ったときの絞り込み・並べ方を含む。画面は中身を解釈せず、そのまま `after` に渡す。
        違う絞り込み・並べ方で渡されたら 400
      pattern: '^n[acrlm][aou][0-9A-Za-z]{12}$'
      minLength: 15
      maxLength: 15
    ProjectListPage:
      type: object
      description: 企画の一覧（並びは listProjects の全順序）。続きがあれば `nextCursor` を返す。全体の数は返さない
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ProjectListCard' }
        nextCursor: { $ref: '#/components/schemas/ProjectListCursor' }
    ProjectListCard:
      type: object
      description: |
        一覧の企画カード（C29）。押すと企画のページ（S15）。S03・S13 の ProjectCard（ある Discovery・場所との関わりを持つ）とは別の形。
        ユーザーの企画は、画面が「[ニックネーム] さんの企画」と出し、ex-day の認定に見せない
      additionalProperties: false
      required: [id, title, type, creatorKind, creatorName, itemCount, triggeredConversationCount]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        title: { type: string, minLength: 1 }
        callText: { type: string, minLength: 1, description: 呼びかけ。なければ返さない }
        type: { $ref: '#/components/schemas/ProjectType' }
        creatorKind:
          type: string
          enum: [operator, user]
        creatorName:
          type: string
          minLength: 1
          description: 作った人の今のニックネーム（表示のたびに引く。Issue #74）
        itemCount:
          type: integer
          minimum: 0
          maximum: 100
          description: 企画の項目の数（S15 の並びの位置の数と同じ。指す先が見えない項目も数える）
        triggeredConversationCount:
          type: integer
          minimum: 0
          description: 企画をきっかけにした公開の会話の数（S15 の triggeredConversations の全体の数と同じ範囲）
    # ---- S15 企画のページ ----
    ProjectType:
      type: string
      enum: [course, ranking, collection, memory]
      description: 企画の型（コース・番付・まとめ・記憶）。順番・順位を出すのはコース・番付だけ
    ProjectDetail:
      type: object
      description: S15（企画のページ）の内容。区画ごとの読み方は画面定義の「取得用 API で返すもの」
      additionalProperties: false
      required: [id, type, title, creatorKind, creatorName, items, timeline, triggeredConversations]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        type: { $ref: '#/components/schemas/ProjectType' }
        title: { type: string, minLength: 1 }
        callText: { type: string, minLength: 1, description: 呼びかけ。なければ返さない }
        description: { type: string, minLength: 1, description: 説明。なければ返さない }
        creatorKind:
          type: string
          enum: [operator, user]
          description: 運営の企画か、ユーザーの企画か（ユーザーの企画は「ex-day の認定ではありません」を添える）
        creatorName:
          type: string
          minLength: 1
          description: 作った人の今のニックネーム（表示のたびに引く。Issue #74）
        items:
          type: array
          maxItems: 100
          description: |
            並び（C37）。順番の順。1つの企画の項目は最大100件（暫定。企画の作成・編集の API で守る）。
            指す先が見えない項目も、位置を残して返す（UnavailableProjectItem）
          items: { $ref: '#/components/schemas/ProjectItem' }
        ownConversationId:
          $ref: '#/components/schemas/PublicId'
          description: 企画そのものの会話（公開のもの）。まだ最初の発言がなく会話がないときは返さない（返信を書くとき・S14 へ移るときに使う）
        timeline: { $ref: '#/components/schemas/ProjectTimeline' }
        triggeredConversations:
          $ref: '#/components/schemas/ConversationCardPage'
          description: |
            企画をきっかけにした会話（入口＝この企画で、企画そのものの会話でないもの）。始まりの新しい順、同じなら識別子の順。
            最大10件と全体の数。続きを読む API はない（MVP の制限。会話が増えたら足す）
    ProjectItem:
      description: 企画の項目（C37）。`kind` で判別する（場所・見える Discovery・表示できない項目）
      oneOf:
        - $ref: '#/components/schemas/PlaceProjectItem'
        - $ref: '#/components/schemas/DiscoveryProjectItem'
        - $ref: '#/components/schemas/UnavailableProjectItem'
    PlaceProjectItem:
      type: object
      description: 場所を指す項目。根拠（推定の値と会話の数）は保存した値ではなく、場所・会話から導く（論理設計 4.6.1節）
      additionalProperties: false
      required: [kind, id, place, placeKinds, spatialType, geometry, anchor, estimates, conversationCount]
      properties:
        kind: { type: string, enum: [place] }
        id: { $ref: '#/components/schemas/PublicId' }
        position: { type: integer, minimum: 1, description: 順番・順位。コース・番付のときだけ返す }
        note: { type: string, minLength: 1, description: 作った人の説明。なければ返さない }
        place: { $ref: '#/components/schemas/PlaceRef' }
        placeKinds:
          type: array
          description: 場所の種類（文字コードの順）
          items: { type: string, minLength: 1 }
        spatialType: { $ref: '#/components/schemas/SpatialType' }
        geometry: { $ref: '#/components/schemas/Geometry' }
        anchor:
          $ref: '#/components/schemas/Position'
          description: 代表点（ピンの位置、コースの回る順の線を結ぶ点）。点はその点、経路は始点、エリアは形の中の1点
        estimates:
          type: array
          description: 推定の値と出どころ（S13 の estimates と同じ形と選び方）。画面は「推定」と出どころを添える
          items: { $ref: '#/components/schemas/PlaceEstimate' }
        conversationCount:
          type: integer
          minimum: 0
          description: この場所が採用されている公開の会話の数（S13 の「この場所の会話」の全体の数と同じ）
    DiscoveryProjectItem:
      type: object
      description: |
        Discovery を指す項目。統合されていれば、最後の統合先（見えるもの）を出す。場所の推定の値は付けない
        （Discovery 自体の根拠のように見せないため）
      additionalProperties: false
      required: [kind, id, discovery, mapPlaces, anchor, originConversationCount, startedConversationCount]
      properties:
        kind: { type: string, enum: [discovery] }
        id: { $ref: '#/components/schemas/PublicId' }
        position: { type: integer, minimum: 1, description: 順番・順位。コース・番付のときだけ返す }
        note: { type: string, minLength: 1, description: 作った人の説明。なければ返さない }
        discovery: { $ref: '#/components/schemas/DiscoverySummary' }
        mapPlaces:
          type: array
          minItems: 1
          description: |
            地図に出す場所（出す位置の場所。DiscoverySummary.displayPlaces と同じ選び方・同じ順）とその形。
            Discovery の中の順番を示す線は返さない
          items: { $ref: '#/components/schemas/ProjectMapPlace' }
        anchor:
          $ref: '#/components/schemas/Position'
          description: 代表点。出す位置の場所の最初の1つの代表点（点はその点、経路は始点、エリアは形の中の1点）
        originConversationCount:
          type: integer
          minimum: 0
          description: この Discovery の由来の、公開の会話の数（同じ会話は1回）
        startedConversationCount:
          type: integer
          minimum: 0
          description: この Discovery から始まった公開の会話の数（同じ会話は1回）。根拠とは限らないので、由来の会話と分けて出す
    ProjectMapPlace:
      type: object
      additionalProperties: false
      required: [place, spatialType, geometry]
      properties:
        place: { $ref: '#/components/schemas/PlaceRef' }
        spatialType: { $ref: '#/components/schemas/SpatialType' }
        geometry: { $ref: '#/components/schemas/Geometry' }
    UnavailableProjectItem:
      type: object
      description: |
        表示できない項目。指していた Discovery（統合されていれば統合先）が非公開・成立の取り消し、または統合先を決められない。
        順番の位置だけを残し、項目・指していたものの識別子・中身・理由は返さない（画面は「表示できません」と出す）
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [unavailable] }
        position: { type: integer, minimum: 1, description: 順番・順位。コース・番付のときだけ返す }
    # ---- タイムライン ----
    TimelineCursor:
      type: string
      description: タイムラインの続きを読むカーソル（並びのキーを含む）。画面は中身を解釈せず、そのまま `before` に渡す
      pattern: '^[cp][0-9A-Za-z]{12}$'
      minLength: 13
      maxLength: 13
    ProjectTimeline:
      type: object
      description: |
        企画そのものの会話の Post と、企画の変更の出来事を混ぜたタイムライン。企画そのものの会話がなくても、出来事だけで返す。

        - **全順序**：時点（Post は投稿の時点、変更の出来事は変更の時点）→ 種類（変更の出来事を先、次に Post）→ 識別子（文字コードの順）
        - 新しい側から `timelineLimit` 件を選び、古い順に並べて返す。それより前が残っていれば `olderCursor` を返す
        - 最初の Post をいつも返すことはしない（企画を作った出来事がタイムラインの最初になる）
        - 非公開の Post も枠として返し、件数に数える（PostItem の HiddenPost）
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/TimelineEntry' }
        olderCursor: { $ref: '#/components/schemas/TimelineCursor' }
    OlderTimelinePage:
      type: object
      description: カーソルより前のタイムライン（古い順。並びは ProjectTimeline）。さらに前が残っていれば `olderCursor` を返す
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/TimelineEntry' }
        olderCursor: { $ref: '#/components/schemas/TimelineCursor' }
    TimelineEntry:
      description: タイムラインの1つ。`kind` で判別する（Post か、変更の出来事か）
      oneOf:
        - $ref: '#/components/schemas/TimelinePost'
        - $ref: '#/components/schemas/TimelineChange'
    TimelinePost:
      type: object
      additionalProperties: false
      required: [kind, post]
      properties:
        kind: { type: string, enum: [post] }
        post: { $ref: '#/components/schemas/PostItem' }
    TimelineChange:
      type: object
      additionalProperties: false
      required: [kind, change]
      properties:
        kind: { type: string, enum: [change] }
        change: { $ref: '#/components/schemas/ProjectChangeEvent' }
    ProjectChangeEvent:
      type: object
      description: |
        企画の変更の出来事（1回の保存）。運営の企画にも出す。表題・呼びかけ・説明は中身を写さず、変えたことだけを返す。
        出来事の中の項目はページングしない（1回の保存で動く項目は最大200件。暫定。企画の作成・編集の API で守る）
      additionalProperties: false
      required: [id, kind, changedAt, items, changedFields]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        kind:
          type: string
          enum: [created, updated]
          description: created は企画を作った（全部の項目が足された）、updated は変えた
        changedAt: { type: string, format: date-time }
        items:
          type: array
          maxItems: 200
          description: 動いた項目（保存した順のまま）。まとめ方は画面が決める
          items: { $ref: '#/components/schemas/ProjectChangeItem' }
        changedFields:
          type: array
          maxItems: 3
          description: 変えた表示の項目（表題・呼びかけ・説明。同じものは1回だけ、この順）。中身は返さない
          items:
            type: string
            enum: [title, callText, description]
    ProjectChangeItem:
      type: object
      additionalProperties: false
      required: [kind, target]
      properties:
        kind:
          type: string
          enum: [added, removed, moved]
          description: 足した・外した・順番を変えた
        beforePosition:
          type: integer
          minimum: 1
          description: 前の順番・順位（外した・順番を変えたとき）。コース・番付のときだけ返す
        afterPosition:
          type: integer
          minimum: 1
          description: 後の順番・順位（足した・順番を変えたとき）。コース・番付のときだけ返す
        target: { $ref: '#/components/schemas/ChangeTarget' }
    ChangeTarget:
      description: |
        動いた項目の指す先。`kind` で判別する。今の状態で出す（並びの項目と同じ決まり）：Discovery が統合されていれば
        最後の統合先（見えるもの）、非公開・成立の取り消し・統合先を決められないときは表示できない（識別子・中身を返さない）
      oneOf:
        - $ref: '#/components/schemas/PlaceChangeTarget'
        - $ref: '#/components/schemas/DiscoveryChangeTarget'
        - $ref: '#/components/schemas/UnavailableChangeTarget'
    PlaceChangeTarget:
      type: object
      additionalProperties: false
      required: [kind, place]
      properties:
        kind: { type: string, enum: [place] }
        place: { $ref: '#/components/schemas/PlaceRef' }
    DiscoveryChangeTarget:
      type: object
      additionalProperties: false
      required: [kind, discovery]
      properties:
        kind: { type: string, enum: [discovery] }
        discovery: { $ref: '#/components/schemas/DiscoveryRef' }
    UnavailableChangeTarget:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [unavailable] }
    Problem:
      type: object
      description: RFC 9457 Problem Details
      required: [title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
