# DB 接続先。ローカルの既定値は compose.yaml の DB（localhost:5433、DB 名・ユーザー・パスワードともに exday）。
# 本番・staging では環境変数で上書きする。
spring.datasource.url=${EXDAY_DB_URL:jdbc:postgresql://localhost:5433/exday}
spring.datasource.username=${EXDAY_DB_USER:exday}
spring.datasource.password=${EXDAY_DB_PASSWORD:exday}

# API 起動時にマイグレーションを流さない（本番・ローカルでは compose の flyway が流す）
spring.flyway.enabled=false

# OpenAPI の servers に合わせて /api/v1 を基準パスにする。
server.servlet.context-path=/api/v1

# TOP（S01）の既定の起点（始める地域の中の場所）と、始める地域の場所。どちらも場所の public_id。
# 既定値はサンプルデータ（db/sample/R__sample_data.sql）の桜木町駅と横浜市
exday.top.default-origin-place-id=${EXDAY_TOP_DEFAULT_ORIGIN_PLACE_ID:160663e75a0b}
exday.top.start-area-place-id=${EXDAY_TOP_START_AREA_PLACE_ID:7cff8aaf2de5}

# 寄り道の到達圏（F06）の計算の決まりの値（F06「設定で持つ値」）。変えると続きのページのカーソルは使えなくなる（400、画面は最初から読み直す）。
# 乗換の10分は、到達圏のデータの版を作るときにグラフの辺に入れる（ここでは持たない）
exday.detour.wait-minutes=5
exday.detour.walk-cap-minutes=15
exday.detour.min-stay-minutes=15
exday.detour.bands=15,30,60,120
exday.detour.walk-meters-per-minute=80
exday.detour.band-detour-factor=1.3
