# DB 接続先。ローカルの既定値は compose.yaml の DB（localhost:5433、DB 名・ユーザー・パスワードともに exday）。
# 本番・staging では環境変数で上書きする。
spring.datasource.url=${EXDAY_DB_URL:jdbc:postgresql://localhost:5433/exday}
spring.datasource.username=${EXDAY_DB_USER:exday}
spring.datasource.password=${EXDAY_DB_PASSWORD:exday}

# API 起動時にマイグレーションを流さない（本番・ローカルでは compose の flyway が流す）
spring.flyway.enabled=false
