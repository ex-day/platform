# API のエラー（problem+json）の title・detail。種類（type）は io.github.exday.api.ApiProblem。
# 開発・調べる人向けの説明。利用者に見せる文言は画面の側で、type ごとに持つ（S12「計算できないとき」）。
# 文言を変えるときは、ここだけを直す（2026-11-26 の人の判断：文言は一元管理する）。
problem.invalid-parameters.title=指定が正しくない
problem.invalid-parameters.detail=Request parameters are invalid.
problem.discovery-not-found.title=Discovery がない
problem.discovery-not-found.detail=Discovery がない、または見られない（非公開・成立の取り消し）。
problem.place-not-found.title=場所がない
problem.place-not-found.detail=場所がない。
problem.conversation-not-found.title=会話がない
problem.conversation-not-found.detail=会話がない、または見られない（非公開）。またはカーソルがこの会話のものでない。
problem.project-not-found.title=企画がない
problem.project-not-found.detail=企画がない、または見られない（非公開）。またはカーソルがこの企画のものでない。
problem.project-list-invalid-cursor.title=カーソルが正しくない
problem.project-list-invalid-cursor.detail=カーソルが、この絞り込み・並べ方で作ったものではない。条件を変えたら最初から読む。
problem.top-origin-not-found.title=起点の場所がない
problem.top-origin-not-found.detail=起点の場所がない。
problem.station-invalid-query.title=探す文字が正しくない
problem.station-invalid-query.detail=探す文字が空。
problem.detour-invalid-minutes.title=使える時間が正しくない
problem.detour-invalid-minutes.detail=使える時間は15分刻み。
problem.detour-invalid-cursor.title=カーソルが正しくない
problem.detour-invalid-cursor.detail=カーソルが読めない、条件が違う、または到達圏のデータ・計算の決まりが切り替わった。最初から読み直す。
problem.detour-from-not-found.title=移動を始める駅がない
problem.detour-from-not-found.detail=移動を始める駅の識別子の場所がない。駅を選び直す。
problem.detour-to-not-found.title=到着の駅がない
problem.detour-to-not-found.detail=到着の駅の識別子の場所がない。駅を選び直す。
problem.detour-from-not-station.title=移動を始める駅が正しくない
problem.detour-from-not-station.detail=移動を始める駅が駅の場所でない（ACTIVE で種類が駅の場所でない）。駅を選び直す。
problem.detour-to-not-station.title=到着の駅が正しくない
problem.detour-to-not-station.detail=到着の駅が駅の場所でない（ACTIVE で種類が駅の場所でない）。駅を選び直す。
problem.detour-from-out-of-coverage.title=移動を始める駅が計算の範囲の外
problem.detour-from-out-of-coverage.detail=移動を始める駅が、使っている到達圏のデータ（版）に入っていない。駅を選び直す。
problem.detour-to-out-of-coverage.title=到着の駅が計算の範囲の外
problem.detour-to-out-of-coverage.detail=到着の駅が、使っている到達圏のデータ（版）に入っていない。駅を選び直す。
problem.detour-no-rail-route.title=到着の駅へ鉄道で着けない
problem.detour-no-rail-route.detail=到着の駅へ、移動を始める駅から鉄道で着けない。駅を選び直す。
problem.detour-data-unavailable.title=到達圏のデータがない
problem.detour-data-unavailable.detail=使っている到達圏のデータ（ACTIVE の版）がない。版を作って activate するまで、寄り道は計算できない。
