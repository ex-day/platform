# ex-day のローカル環境（Issue #89・#114）
#
#   docker compose up
#
# DB、テーブル・サンプルデータを入れる Flyway、API、画面を起動する。
# ブラウザで http://localhost:3000 を開く。手順はリポジトリ直下の README.md を参照。
# 手元のポートは環境変数で変えられる（ほかのプロジェクトと同時に動かす場合）。
services:
  db:
    build:
      context: ./db
    environment:
      POSTGRES_DB: exday
      POSTGRES_USER: exday
      POSTGRES_PASSWORD: exday
    ports:
      # ex-day/poc の DB（5432）と同時に動かせるように、手元のポートは 5433 にする
      - "127.0.0.1:${EXDAY_DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exday -d exday"]
      interval: 2s
      timeout: 3s
      retries: 30

  # テーブル（db/migration）とサンプルデータ（db/sample）を入れて終わる
  flyway:
    image: flyway/flyway:11
    command: >
      -url=jdbc:postgresql://db:5432/exday
      -user=exday
      -password=exday
      -locations=filesystem:/flyway/migration,filesystem:/flyway/sample
      migrate
    volumes:
      - ./db/migration:/flyway/migration:ro
      - ./db/sample:/flyway/sample:ro
    depends_on:
      db:
        condition: service_healthy

  # API（apps/api）。Flyway がテーブルとサンプルデータを入れ終わってから起動する
  api:
    build:
      # OpenAPI（docs/api/openapi.yaml）から生成するため、context はリポジトリ直下にする
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      EXDAY_DB_URL: jdbc:postgresql://db:5432/exday
      EXDAY_DB_USER: exday
      EXDAY_DB_PASSWORD: exday
      # 開発用の「今」と「いる場所」（dev/exday-dev.local.yaml、git の管理外）を読む。なければ実際の日時と既定エリア
      SPRING_CONFIG_IMPORT: optional:file:/config/exday-dev.local.yaml
    volumes:
      - ./dev:/config:ro
    ports:
      # 画面を手元で npm run dev するときの呼び先（apps/web の既定値 http://localhost:8080/api/v1）に合わせる
      - "127.0.0.1:${EXDAY_API_PORT:-8080}:8080"
    depends_on:
      flyway:
        condition: service_completed_successfully

  # 画面（apps/web）。API はコンテナの中からサービス名（api）で呼ぶ
  web:
    build:
      context: ./apps/web
    environment:
      EXDAY_API_BASE_URL: http://api:8080/api/v1
    ports:
      - "127.0.0.1:${EXDAY_WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  db-data:
