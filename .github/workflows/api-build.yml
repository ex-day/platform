name: apps/api build

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "db/**"
      - "docs/api/openapi.yaml"
      - ".github/workflows/api-build.yml"
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "db/**"
      - "docs/api/openapi.yaml"
      - ".github/workflows/api-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/api/**/*.gradle*', 'apps/api/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: gradlew build
        working-directory: apps/api
        run: ./gradlew --no-daemon build
