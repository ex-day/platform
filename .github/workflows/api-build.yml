name: apps/api build

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "db/**"
      - "docs/api/openapi.yaml"
      - ".github/workflows/api-build.yml"
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "db/**"
      - "docs/api/openapi.yaml"
      - ".github/workflows/api-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/api/**/*.gradle*', 'apps/api/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: gradlew build
        working-directory: apps/api
        run: ./gradlew --no-daemon build

      # TEMP（PR #152 の作業中だけ。マージ前に消す）：生成したコードを見るため
      - name: TEMP generate only
        if: always()
        working-directory: apps/api
        run: ./gradlew --no-daemon openApiGenerate
      - name: TEMP upload generated
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-openapi
          path: apps/api/build/generated/openapi/src/main/java
