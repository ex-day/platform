# 探索用の路線（運行系統）：京王線〜都営新宿線の直通運転（F06「データの形」9、#170）
#
# 書き方と書き方の決まりは jr-east.toml の先頭を見る。このファイルの lines・replace_lines の「路線名」は operator の路線
#
# 日中の走り方（2026-11-27 に確かめた。都営地下鉄新宿線・京王線の解説・路線図）：
# - 都営新宿線の列車は日中すべて各駅停車で、毎時10本。京王線内は快速（橋本まで、毎時3本）・区間急行（京王多摩センターまで、
#   毎時3本）・各駅停車（笹塚まで、毎時4本）
# - 笹塚までの列車は、快速・区間急行の系統の区間運転として分けない（書き方の決まり）
# - 新宿〜笹塚は京王新線（N02 では京王線の中。初台・幡ヶ谷は新線にだけ駅がある）を通る。初台・幡ヶ谷に止まるので、新線を通る
# - 駅では、その駅の路線の名前（新宿線・京王線・相模原線）で見せる（name_by_line）
# 置き換えはしない（N02 の路線は残す）

operator = "京王電鉄"

[[service]]
key = "keio-toei-shinjuku-rapid"
name = "都営新宿線・京王線直通"
kind = "快速"
speed_kmh = 38
name_by_line = true
lines = [{ operator = "東京都", name = "10号線新宿線" }, "京王線", "相模原線"]
stops = ["本八幡", "篠崎", "瑞江", "一之江", "船堀", "東大島", "大島", "西大島", "住吉", "菊川", "森下", "浜町", "馬喰横山",
         "岩本町", "小川町", "神保町", "九段下", "市ヶ谷", "曙橋", "新宿三丁目", "新宿", "初台", "幡ヶ谷", "笹塚", "明大前",
         "下高井戸", "桜上水", "八幡山", "千歳烏山", "仙川", "つつじヶ丘", "調布", "京王多摩川", "京王稲田堤",
         "京王よみうりランド", "稲城", "若葉台", "京王永山", "京王多摩センター", "京王堀之内", "南大沢", "多摩境", "橋本"]

[[service]]
key = "keio-toei-shinjuku-semi-express"
name = "都営新宿線・京王線直通"
kind = "区間急行"
speed_kmh = 38
name_by_line = true
lines = [{ operator = "東京都", name = "10号線新宿線" }, "京王線", "相模原線"]
stops = ["本八幡", "篠崎", "瑞江", "一之江", "船堀", "東大島", "大島", "西大島", "住吉", "菊川", "森下", "浜町", "馬喰横山",
         "岩本町", "小川町", "神保町", "九段下", "市ヶ谷", "曙橋", "新宿三丁目", "新宿", "初台", "幡ヶ谷", "笹塚", "明大前",
         "桜上水", "千歳烏山", "仙川", "つつじヶ丘", "調布", "京王多摩川", "京王稲田堤", "京王よみうりランド", "稲城", "若葉台",
         "京王永山", "京王多摩センター"]
