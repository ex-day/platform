# 探索用の路線（運行系統）：JR東日本（F06「データの形」9、#170）
#
# 版を作るとき（tools/reach/reach_build.py build）に読み、版の表（reach.build_service・reach.build_service_stop）に写す。
# 直すときは PR でレビューする（2026-11-26 の人の判断）。
#
# - operator：N02 の事業者名（このファイルの系統の主な事業者。lines・replace_lines の「路線名」はこの事業者の路線）
# - service.key：変えない識別子（英小文字・数字・ハイフン）。name：見せる系統の名前。kind：種別（停車駅や速さが違えば別の系統）
# - speed_kmh：表定速度（試作の目安の値。「行けない」側に寄せて遅めに置く）
# - lines：通る N02 の路線。隣の停車駅の間は、この路線の線路だけをたどって道のりを測る（実際の運行の経路と違う最短の道を選ばないように）。
#   ほかの事業者の路線は { operator = "東京地下鉄", name = "13号線副都心線" } と書く（事業者をまたぐ直通）
# - stops：停車駅の並び（駅の名前。「駅」を付けない。lines の路線の駅から探す）。{ via = "駅名" } は通過地点で、経路を決めるだけ
#   （乗り降り・乗換はしない。lines の中に道が2つ以上あるところで、実際の経路を通らせる。PR #173 のレビュー）
# - loop：環状。停車駅は1回ずつ並べ、最初の駅を最後に繰り返さない（最後の駅から最初の駅へもつながる）
# - stop_names：駅ごとに見せる名前を変えるとき（その系統の [service.stop_names] に "駅" = "見せる名前" を並べる）
#
# 書き方の決まり（2026-11-26 の人の判断）
# - 系統は、日中に毎時走っているものだけを入れる。一部の時間帯だけの快速・特急は入れない（時刻表を使わないので、入れると
#   その時間帯の外も短く出る。所要時間は「行けない」側に寄せる）。平日と土休日で停車駅が違うときは、止まる駅の少ないほうにする
# - 途中で分かれる路線（行き先の違う列車）は、分かれる先ごとに別の系統にする。名前は同じでよい（駅の候補では1つにまとまる）
# - 実際には直通しない区間を1本の系統にしない（その駅で乗換なしに通り抜けられる扱いになる）。直通しないなら系統を分ける
# - 途中で折り返す列車（区間運転）は、全区間を走る系統に含まれるので分けない
# - 停車駅は、版を作る範囲（今はメッシュ 5339）の中の駅だけを並べる。範囲を広げるときに足す
#
# - replace_lines：置き換えてよい N02 の路線（人が付ける）。この路線は、系統の走る区間の乗車の辺を外す。付けていない路線は残す
#   （系統を足しただけでは、各駅停車だけの駅へ行けなくならないように。2026-11-26 の人の判断）。
#   外した区間の駅に乗れる点が残らないときは、版を作るのを失敗にする
# - [[junction]]：駅でないところで、系統が N02 の路線から別の路線へ移るつなぎ目（lines に2つの路線、near に近くの駅の名前）。
#   同じ路線を2つ書き、gap_m（m。50 まで）を書くと、N02 の同じ路線の中の線路の切れ目（少し離れて終わる2つの点）をつなぐ。
#   違う路線どうしは同じ位置（1 m 以内）だけで、gap_m は書けない（立体交差・並ぶ線路をつながないように。PR #175 のレビュー）
#   N02 では、路線どうしは駅の乗換でしかつながらない。同じ位置にある路線の違う点は立体交差のこともあるので、自動ではつながず、
#   人が地図で線路がつながることを確かめて書く（PR #174 のレビュー）。近くの駅から 500 m 以内の点だけを使う。
#   版を作るとき、使うつなぎ目と、書いていない候補（どれかの系統が両方の路線を通るもの）をログに出す

operator = "東日本旅客鉄道"
# 2026-11-26：山手線・東北線・根岸線は、走る区間の駅にどれかの系統が止まることを確かめた（版を作るときの確かめも通った）。
# 東海道線は置き換えない（2026-11-26 の人の判断。品川〜横浜などは、系統と N02 の東海道線の両方で乗れる）
replace_lines = ["山手線", "東北線", "根岸線"]

[[junction]]
# 大崎支線（N02 では東海道線）が、大崎の南で山手線の線路につながる（湘南新宿ライン・埼京線・相鉄線直通が通る）
lines = ["東海道線", "山手線"]
near = "大崎"

