         "赤羽", "十条", "板橋", "池袋", "新宿", "渋谷", "恵比寿", "大崎",
         "大井町", "品川シーサイド", "天王洲アイル", "東京テレポート", "国際展示場", "東雲", "新木場"]

[service.stop_names]
