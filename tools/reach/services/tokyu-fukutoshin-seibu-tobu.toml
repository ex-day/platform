# 探索用の路線（運行系統）：みなとみらい線・東急東横線〜副都心線〜西武池袋線・東武東上線の直通運転（F06「データの形」9、#170）
#
# 書き方と書き方の決まりは jr-east.toml の先頭を見る。このファイルの lines・replace_lines の「路線名」は operator の路線
#
# 日中の走り方（2026-11-27 に、副都心線の池袋駅（両方向）・小竹向原駅（和光市方面）・平和台駅・地下鉄成増駅の平日の時刻表
# （2026-03-14 現在のデータ。駅探）で確かめた）：
# - 副都心線の列車は、渋谷ですべて東横線へ直通する。池袋の渋谷方面は毎時14本：Fライナー（東急線内特急。毎時4本）、
#   東急線内各停（毎時6本）、東急線内急行（毎時2本）、東急線内急行・相鉄線内各停（湘南台行。毎時2本）。どれも元町・中華街行
#   （相鉄直通は湘南台行）。東急線内の種別で止まる駅が変わる
# - 池袋の和光市方面は毎時約13本：Fライナー（西武線内快速急行の小手指行・東武線内快速急行の森林公園行。毎時2本ずつ）、
#   和光市行（毎時6本）、西武線の石神井公園行（西武線内準急・各停。毎時1本ずつ）、東武線の川越市行（東武線内普通。毎時1本）
# - Fライナーは副都心線内急行で、急行の停車駅（和光市・小竹向原・池袋・新宿三丁目・明治神宮前・渋谷。東京メトロの路線のページ）
#   に止まる。小竹向原〜和光市は止まらない（平和台・地下鉄成増の時刻表にない）。Fライナーは全区間で種別が決まっているので、
#   元町・中華街〜小手指・森林公園の通しの系統にした
# - Fライナー以外の列車は、東急線側の種別と、和光市・西武線・東武線側の行き先がどう組み合わさるかは時刻表から分からない。
#   ない直通をつくらないように、東急線側の系統（元町・中華街・湘南台〜渋谷〜和光市）と、西武線・東武線側の系統（渋谷〜
#   石神井公園・川越市）に分けた。どちらも渋谷〜小竹向原を全部走る（東急線と西武線・東武線の間は副都心線の駅で乗換になる）
#   - 東急線側の系統を和光市まで走らせるのは、平和台の渋谷方面に東急線内各停・急行・相鉄直通が来るため（和光市から来る）
#   - 西武線の準急は、各停の系統の駅に全部止まるので、各停の系統だけにした
# - 東急線・みなとみらい線・西武線・東武線の種別ごとの停車駅は、路線図の停車駅一覧による（路線図ドットコム）
# - 版の範囲（メッシュ 5339）の端：東武東上線は北坂戸まで（森林公園は範囲の外）
# - 駅では、その駅の路線の名前で見せる（name_by_line）
# - 池袋は、N02 で副都心線の駅の場所が別（#163 の名寄せで扱う）。停車駅に副都心線の駅と書く
# 置き換えはしない（N02 の路線は残す）

operator = "東急電鉄"

[[service]]
key = "tokyu-fukutoshin-seibu-fliner"
name = "Fライナー"
kind = "Fライナー"
speed_kmh = 42
name_by_line = true
lines = [{ operator = "横浜高速鉄道", name = "みなとみらい21線" }, "東横線", { operator = "東京地下鉄", name = "13号線副都心線" },
         { operator = "西武鉄道", name = "西武有楽町線" }, { operator = "西武鉄道", name = "池袋線" }]
stops = ["元町・中華街", "みなとみらい", "横浜", "菊名", "武蔵小杉", "自由が丘", "中目黒", "渋谷", "明治神宮前", "新宿三丁目", { stop = "池袋", line = { operator = "東京地下鉄", name = "13号線副都心線" } },
