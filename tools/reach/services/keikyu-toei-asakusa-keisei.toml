# 探索用の路線（運行系統）：京急線〜都営浅草線〜京成線・北総線の直通運転（F06「データの形」9、#170）
#
# 書き方と書き方の決まりは jr-east.toml の先頭を見る。このファイルの lines・replace_lines の「路線名」は operator の路線
#
# 日中の走り方（2026-11-27 に、都営浅草線の浅草駅の平日の時刻表（2026-11-24 改正）で確かめた）：
# - 泉岳寺〜押上は毎時約12本。京急線へは特急（三崎口・羽田空港。毎時3本ずつ）・快特（羽田空港）・エアポート快特（羽田空港）、
#   京成線・北総線へは快速（成田空港。京成本線経由）・普通（印旛日本医大。北総線）・普通（青砥）・快特（京成高砂）・
#   エアポート快特（成田空港）。浅草線の中は、エアポート快特のほかは各駅に止まる。西馬込〜泉岳寺は区間運転と、京成線の特急
# - 京急線側の種別と京成線側の種別がどう組み合わさるかは、時刻表から分からない。ない直通をつくらないように、京急線〜浅草線の
#   系統と、浅草線〜京成線・北総線の系統に分け、どちらも浅草線の泉岳寺〜押上を全部走らせる（京急線と京成線の間は浅草線の駅で
#   乗換になる。所要時間は「行けない」側に寄る）
# - 40分に1本のエアポート快特と、快特（羽田空港・京成高砂）は入れない（浅草線の駅を通過する列車で、停車駅を確かめられなかった。
#   入れなくても、特急・普通で同じ区間に乗れる）
# - 京急線内の特急・京成線内の快速・特急の停車駅は、路線図の停車駅一覧による。2026-11-24 の改正で変わっていないかは確かめていない
#   （止まる駅が少ないほうの一覧を使った。ほかの駅は N02 の路線で乗れる）
# - 版の範囲（メッシュ 5339）の端：京急は金沢文庫、京成本線は船橋競馬場、北総線は新鎌ヶ谷まで
# - 駅では、その駅の路線の名前（浅草線・本線・空港線・押上線・北総線）で見せる（name_by_line）
# 置き換えはしない（N02 の路線は残す）

operator = "東京都"

[[service]]
key = "keikyu-toei-asakusa-main"
name = "京急線・都営浅草線直通"
kind = "特急"
speed_kmh = 42
name_by_line = true
lines = ["1号線浅草線", { operator = "京浜急行電鉄", name = "本線" }]
stops = ["押上", "本所吾妻橋", "浅草", "蔵前", "浅草橋", "東日本橋", "人形町", "日本橋", "宝町", "東銀座", "新橋", "大門", "三田",
         "泉岳寺", "品川", "京急蒲田", "京急川崎", "横浜", "上大岡", "金沢文庫"]

[[service]]
key = "keikyu-toei-asakusa-airport"
name = "京急線・都営浅草線直通"
kind = "特急"
speed_kmh = 38
name_by_line = true
lines = ["1号線浅草線", { operator = "京浜急行電鉄", name = "本線" }, { operator = "京浜急行電鉄", name = "空港線" }]
stops = ["押上", "本所吾妻橋", "浅草", "蔵前", "浅草橋", "東日本橋", "人形町", "日本橋", "宝町", "東銀座", "新橋", "大門", "三田",
         "泉岳寺", "品川", "京急蒲田", "羽田空港第3ターミナル", "羽田空港第1・第2ターミナル"]

[[service]]
key = "toei-asakusa-keisei-local"
name = "都営浅草線・京成線直通"
kind = "普通"
speed_kmh = 32
name_by_line = true
lines = ["1号線浅草線", { operator = "京成電鉄", name = "押上線" }]
stops = ["泉岳寺", "三田", "大門", "新橋", "東銀座", "宝町", "日本橋", "人形町", "東日本橋", "浅草橋", "蔵前", "浅草", "本所吾妻橋",
         "押上", "京成曳舟", "八広", "四ツ木", "京成立石", "青砥"]

[[service]]
key = "toei-asakusa-hokuso-local"
name = "都営浅草線・京成線・北総線直通"
kind = "普通"
speed_kmh = 35
name_by_line = true
lines = ["1号線浅草線", { operator = "京成電鉄", name = "押上線" }, { operator = "京成電鉄", name = "本線" },
         { operator = "北総鉄道", name = "北総線" }]
stops = ["泉岳寺", "三田", "大門", "新橋", "東銀座", "宝町", "日本橋", "人形町", "東日本橋", "浅草橋", "蔵前", "浅草", "本所吾妻橋",
         "押上", "京成曳舟", "八広", "四ツ木", "京成立石", "青砥", "京成高砂", "新柴又", "矢切", "北国分", "秋山", "東松戸",
         "松飛台", "大町", "新鎌ヶ谷"]

[[service]]
key = "toei-asakusa-keisei-rapid"
name = "都営浅草線・京成線直通"
kind = "快速"
speed_kmh = 40
name_by_line = true
lines = ["1号線浅草線", { operator = "京成電鉄", name = "押上線" }, { operator = "京成電鉄", name = "本線" }]
stops = ["泉岳寺", "三田", "大門", "新橋", "東銀座", "宝町", "日本橋", "人形町", "東日本橋", "浅草橋", "蔵前", "浅草", "本所吾妻橋",
         "押上", "青砥", "京成高砂", "京成小岩", "京成八幡", "東中山", "京成船橋", "船橋競馬場"]

[[service]]
# 西馬込から京成線へ直通する特急（毎時3本）。西馬込〜泉岳寺の区間運転も、この系統に含める
key = "toei-asakusa-nishimagome-keisei"
name = "都営浅草線・京成線直通"
kind = "特急"
speed_kmh = 38
name_by_line = true
lines = ["1号線浅草線", { operator = "京成電鉄", name = "押上線" }, { operator = "京成電鉄", name = "本線" }]
stops = ["西馬込", "馬込", "中延", "戸越", "五反田", "高輪台", "泉岳寺", "三田", "大門", "新橋", "東銀座", "宝町", "日本橋", "人形町",
         "東日本橋", "浅草橋", "蔵前", "浅草", "本所吾妻橋", "押上", "青砥", "京成高砂", "京成八幡", "京成船橋"]
