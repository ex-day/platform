# 探索用の路線（運行系統）：東急田園都市線〜半蔵門線〜東武伊勢崎線（スカイツリーライン）の直通運転（F06「データの形」9、#170）
#
# 書き方と書き方の決まりは jr-east.toml の先頭を見る。このファイルの lines・replace_lines の「路線名」は operator の路線
#
# 日中の走り方（2026-11-27 に確かめた。田園都市線・半蔵門線の解説）：
# - 半蔵門線の列車は、渋谷ですべて田園都市線へ直通する（毎時約12本）。押上では約半分が東武線へ直通し、残りは押上で折り返す
# - 田園都市線内は急行（毎時3本。東武線の久喜まで直通）・準急（毎時3本。押上まで）・各駅停車（毎時6本）
# - 各駅停車の行き先は時刻表で確かめられなかった。半蔵門線の本数と、東武線へ直通する本数（約半分）・準急が押上までであることから、
#   一部が東武線へ直通するとみて、急行と同じく東武線まで直通する系統にした（押上までの列車はその区間運転）
# - 東武線内は急行・準急があり、直通する列車の田園都市線内の種別との組み合わせはいろいろある。止まる駅の少ない急行にした
#   （準急だけが止まる駅は、N02 の伊勢崎線で乗れる）
# - 版の範囲（メッシュ 5339）の北の端は北春日部で、東武の急行の停車駅は春日部まで
# - 駅では、その駅の路線の名前（田園都市線・半蔵門線・伊勢崎線）で見せる（name_by_line）
# 置き換えはしない（N02 の路線は残す）

operator = "東急電鉄"

[[junction]]
# N02 の東武伊勢崎線は、押上駅の線路と、曳舟へ向かう線路が約 16 m 離れて終わっていて、つながっていない（線路の切れ目）。
# 半蔵門線から東武線へ直通する列車は押上 → 曳舟を通るので、ここをつなぐ（2026-11-27 に、点の位置で確かめた）
lines = [{ operator = "東武鉄道", name = "伊勢崎線" }, { operator = "東武鉄道", name = "伊勢崎線" }]
near = "押上"
gap_m = 20

[[service]]
key = "tokyu-hanzomon-tobu-express"
name = "田園都市線・半蔵門線・東武線直通"
kind = "急行"
speed_kmh = 38
name_by_line = true
lines = ["田園都市線", { operator = "東京地下鉄", name = "11号線半蔵門線" }, { operator = "東武鉄道", name = "伊勢崎線" }]
stops = ["中央林間", "南町田グランベリーパーク", "長津田", "青葉台", "あざみ野", "たまプラーザ", "鷺沼", "溝の口", "二子玉川",
         "三軒茶屋", "渋谷", "表参道", "青山一丁目", "永田町", "半蔵門", "九段下", "神保町", "大手町", "三越前", "水天宮前",
         "清澄白河", "住吉", "錦糸町", "押上", "曳舟", "北千住", "西新井", "草加", "新越谷", "越谷", "せんげん台", "春日部"]

[[service]]
